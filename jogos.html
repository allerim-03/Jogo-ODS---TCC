<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivando o Saber - Jogos</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>

        /* =====================================================
           REMOÇÃO TOTAL DE MARGENS E ESPAÇAMENTOS NO TOPO
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #FFFFFF !important;
        }


        /* =====================================================
           FUNDO TOTALMENTE BRANCO E HOMOGÊNEO
        ===================================================== */

        main {
            background-color: #FFFFFF !important;
        }

        .boas-vindas {
            background-color: #FFFFFF !important;
        }


        /* =====================================================
           TOPBAR FIXADA DIRETAMENTE NO TOPO
        ===================================================== */

        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;
            margin: 0 !important;
        }


        /* =====================================================
           MENU HAMBÚRGUER
           MESMO PADRÃO DO INDEX
        ===================================================== */

        .topbar .hamburger {
            width: 30px !important;
            height: 30px !important;

            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: flex-start !important;

            gap: 6px !important;

            cursor: pointer !important;

            padding: 0 !important;
            margin: 0 !important;
        }

        .topbar .hamburger span {
            display: block !important;

            width: 30px !important;
            height: 4px !important;

            background-color: #ffffff !important;

            border-radius: 5px !important;

            margin: 0 !important;
            padding: 0 !important;

            transform: none !important;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            display: flex !important;
            flex-direction: column !important;
        }


        /* =====================================================
           BOTÃO SAIR
           MESMO PADRÃO DO INDEX
        ===================================================== */

        .sidebar .links-sidebar .link-sair {
            color: #ffffff !important;
            text-decoration: none !important;

            display: flex !important;
            align-items: center !important;

            gap: 10px !important;

            font-weight: bold !important;
            font-size: 16px !important;

            transition: color 0.2s ease !important;

            margin-top: 45px !important;

            cursor: pointer !important;
        }

        .sidebar .links-sidebar .link-sair:hover {
            color: #FFDD55 !important;
        }


        /* =====================================================
           ÍCONE DO SAIR
        ===================================================== */

        .sidebar .links-sidebar .link-sair .icone-sair {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            color: #ffffff !important;

            transition: color 0.2s ease !important;
        }

        .sidebar .links-sidebar .link-sair:hover .icone-sair {
            color: #FFDD55 !important;
        }

        .sidebar .links-sidebar .link-sair .icone-sair svg {
            width: 23px !important;
            height: 23px !important;

            stroke: #ffffff !important;

            fill: none !important;

            stroke-width: 2.5 !important;
            stroke-linecap: round !important;
            stroke-linejoin: round !important;

            transition: stroke 0.2s ease !important;
        }

        .sidebar .links-sidebar .link-sair:hover .icone-sair svg {
            stroke: #FFDD55 !important;
        }


        /* =====================================================
           LADO ESQUERDO
        ===================================================== */

        .topbar .left {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
        }


        /* Container vertical para Logo e XP */

        .topbar .info-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 6px !important;
        }


        /* Logo */

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }


        /* =====================================================
           BARRA DE NÍVEL E XP
        ===================================================== */

        .topbar .level {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;

            color: #ffffff !important;

            font-size: 12px !important;
            font-weight: bold !important;

            line-height: 1 !important;
        }

        .topbar .level .star {
            color: #FFDD55 !important;
        }

        .topbar .level .bar {
            width: 120px !important;
            height: 10px !important;

            background-color: #2E7D32 !important;

            border-radius: 10px !important;

            overflow: hidden !important;
        }

        .topbar .level .progress {
            height: 100% !important;

            background-color: #FFDD55 !important;

            border-radius: 10px !important;
        }

        .topbar .level .xp {
            font-size: 11px !important;

            color: #ffffff !important;

            opacity: 0.95;
        }


        /* =====================================================
           MENU DE NAVEGAÇÃO
        ===================================================== */

        .topbar nav.menu {
            margin-left: auto !important;
            margin-right: 25px !important;

            display: flex !important;
            align-items: center !important;

            gap: 20px !important;
        }

        .topbar nav.menu a {
            color: #ffffff !important;

            text-decoration: none !important;

            font-weight: bold !important;
            font-size: 15px !important;

            transition: color 0.2s ease !important;

            padding-bottom: 3px !important;

            border-bottom: none !important;
        }

        .topbar nav.menu a:hover {
            color: #FFDD55 !important;

            border-bottom: none !important;
        }

        .topbar nav.menu a.active {
            color: #ffffff !important;

            border-bottom: none !important;
        }


        /* =====================================================
           FOTO DE PERFIL
        ===================================================== */

        .topbar .perfil-externo img,
        .topbar img.foto-perfil {
            width: 45px !important;
            height: 45px !important;

            border-radius: 50% !important;

            object-fit: cover !important;

            display: block !important;

            border: 2px solid #ffffff;
        }


        /* =====================================================
           COMPENSAÇÃO DO CONTEÚDO PELA NAVBAR FIXA
        ===================================================== */

        main {
            margin-top: 90px !important;
            padding-top: 0 !important;
        }


        /* =====================================================
           GARANTE FUNDO BRANCO NA ÁREA DA PÁGINA
        ===================================================== */

        main,
        main section,
        .boas-vindas {
            background-color: #FFFFFF !important;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="topbar">

        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >

        <label
            for="menu-check"
            class="overlay">
        </label>


        <!-- =================================================
             SIDEBAR MOBILE
        ================================================= -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <img
                    src="img/foto.png"
                    class="foto-perfil"
                    alt="Foto de perfil"
                >

                <p>Nível 2</p>

            </div>


            <nav class="links-sidebar">

                <a href="index.html">
                    HOME
                </a>

                <a href="ods.html">
                    ODS
                </a>

                <a href="quiz.html">
                    QUIZ
                </a>

                <a
                    href="jogos.html"
                    class="active"
                >
                    JOGOS
                </a>

                <a href="ranking.html">
                    RANKING
                </a>

                <a href="perfil.html">
                    PERFIL
                </a>

                <a href="sobrenos.html">
                    SOBRE NÓS
                </a>


                <!-- =========================================
                     SAIR
                ========================================= -->

                <a
                    href="home.html"
                    class="link-sair"
                    aria-label="Sair"
                >

                    <span class="icone-sair">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4">
                            </path>

                            <polyline points="16 17 21 12 16 7">
                            </polyline>

                            <line
                                x1="21"
                                y1="12"
                                x2="9"
                                y2="12"
                            >
                            </line>

                        </svg>

                    </span>

                    <span>
                        SAIR
                    </span>

                </a>

            </nav>

        </aside>


        <!-- =================================================
             LADO ESQUERDO
        ================================================= -->

        <div class="left">

            <label
                for="menu-check"
                class="hamburger"
                aria-label="Abrir menu"
            >

                <span></span>
                <span></span>
                <span></span>

            </label>


            <div class="info-container">

                <div class="logo">

                    <img
                        src="img/cultsab.png"
                        alt="Cultivando o Saber"
                        class="navbar-logo"
                    >

                </div>


                <div class="level">

                    <span class="star">
                        ★ NÍVEL 2
                    </span>


                    <div class="bar">

                        <div
                            class="progress"
                            style="width: 45%;"
                        >
                        </div>

                    </div>


                    <span class="xp">
                        450/1000
                    </span>

                </div>

            </div>

        </div>


        <!-- =================================================
             MENU DE NAVEGAÇÃO CENTRAL
        ================================================= -->

        <nav class="menu">

            <a href="index.html">
                HOME
            </a>

            <a href="ods.html">
                ODS
            </a>

            <a href="quiz.html">
                QUIZ
            </a>

            <a
                href="jogos.html"
                class="active"
            >
                JOGOS
            </a>

            <a href="ranking.html">
                RANKING
            </a>

            <a href="perfil.html">
                PERFIL
            </a>

            <a href="sobrenos.html">
                SOBRE NÓS
            </a>

        </nav>


        <!-- =================================================
             PERFIL À DIREITA
        ================================================= -->

        <a
            href="perfil.html"
            class="perfil-externo"
        >

            <img
                src="img/foto.png"
                class="foto-perfil"
                alt="Perfil"
            >

        </a>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>

        <section
            class="boas-vindas"
            style="
                padding-top: 20px !important;
                margin-top: 0 !important;
            "
        >

            <h2
                style="
                    margin-top: 0 !important;
                    color: #4CAF50 !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                    text-align: center;
                "
            >
                Escolha um jogo
            </h2>


            <p style="text-align: center;">
                Divirta-se enquanto aprende sobre sustentabilidade
            </p>


            <div class="carousel-wrapper">


                <button
                    class="nav-btn prev"
                    id="btn-prev"
                >
                    &#10094;
                </button>


                <div class="jogos-container">


                    <div
                        class="jogo-wrapper"
                        data-index="0"
                    >

                        <div
                            id="capa-jogo-1"
                            class="capa-jogo"
                        >

                            <h3>
                                JOGO 1
                            </h3>


                            <a
                                href="jogo1.html"
                                class="btn-login"
                                style="
                                    display: inline-block;
                                    text-decoration: none;
                                    text-align: center;
                                "
                            >
                                JOGAR
                            </a>

                        </div>


                        <canvas
                            id="canvas-jogo-1"
                            width="600"
                            height="400"
                            class="canvas-game"
                        >
                        </canvas>

                    </div>


                    <div
                        class="jogo-wrapper active"
                        data-index="1"
                    >

                        <div
                            id="capa-jogo-2"
                            class="capa-jogo"
                        >

                            <h3>
                                JOGO 2
                            </h3>


                            <a
                                href="jogo2.html"
                                class="btn-login"
                                style="
                                    display: inline-block;
                                    text-decoration: none;
                                    text-align: center;
                                "
                            >
                                JOGAR
                            </a>

                        </div>


                        <canvas
                            id="canvas-jogo-2"
                            width="600"
                            height="400"
                            class="canvas-game"
                        >
                        </canvas>

                    </div>


                    <div
                        class="jogo-wrapper"
                        data-index="2"
                    >

                        <div
                            id="capa-jogo-3"
                            class="capa-jogo"
                        >

                            <h3>
                                JOGO 3
                            </h3>


                            <a
                                href="jogo3.html"
                                class="btn-login"
                                style="
                                    display: inline-block;
                                    text-decoration: none;
                                    text-align: center;
                                "
                            >
                                JOGAR
                            </a>

                        </div>


                        <canvas
                            id="canvas-jogo-3"
                            width="600"
                            height="400"
                            class="canvas-game"
                        >
                        </canvas>

                    </div>


                </div>


                <button
                    class="nav-btn next"
                    id="btn-next"
                >
                    &#10095;
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


    <script src="js/telajogos.js"></script>


</body>

</html>
