    <link rel="stylesheet" href="css/global.css">

    <style>
        /* Remoção de margens do topo da página */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Estrutura flex da navbar padronizada */
        .topbar {
            margin-top: 0 !important;
            top: 0 !important;
            position: relative;
            width: 100%;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 20px !important;
            box-sizing: border-box !important;
            background-color: #4caf50;
        }

        /* Lado esquerdo: ícone do menu + logo + barra de progresso */
        .topbar .left {
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
        }

        .topbar .info-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            gap: 4px !important;
        }

        /* Menu de navegação alinhado à direita */
        .topbar nav.menu {
            margin-left: auto !important;
            margin-right: 25px !important;
            display: flex !important;
            align-items: center !important;
            gap: 20px !important;
        }

        /* Links com estilo e hover amarelo com sublinhado */
        .topbar nav.menu a {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 15px !important;
            transition: color 0.2s ease, border-bottom 0.2s ease !important;
            padding-bottom: 2px !important;
            border-bottom: 2px solid transparent !important;
        }

        .topbar nav.menu a:hover,
        .topbar nav.menu a.active {
            color: #ffeb3b !important;
            border-bottom: 2px solid #ffeb3b !important;
        }

        /* Perfil circular à direita */
        .topbar .perfil-externo img {
            width: 40px !important;
            height: 40px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            display: block !important;
        }
    </style>
</head>

<body>
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <aside class="sidebar">
            <div class="perfil-sidebar">
                <img src="img/foto.png" class="foto-perfil" alt="Foto de perfil">

            </div>

            <nav class="links-sidebar">
                <a href="index.html">HOME</a>
                <a href="ods.html">ODS</a>

                <a href="sobrenos.html">SOBRE NÓS</a>
            </nav>
        </aside>

        <!-- Lado Esquerdo: Hambúrguer, Logotipo e Nível/Barra abaixo do logo -->
        <div class="left">
            <label for="menu-check" class="hamburger" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <div class="info-container">
                <div class="logo">
                    <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
                </div>

                <div class="level">
                    <span class="star">★ NÍVEL 2</span>
                    <div class="bar">
                        <div class="progress" style="width: 45%;"></div>
                    </div>
                    <span class="xp">450/1000</span>
                </div>
            </div>
        </div>

        <!-- Menu de Navegação à Direita -->
        <nav class="menu">
            <a href="index.html">HOME</a>
            <a href="ods.html">ODS</a>
            <a href="quiz.html">QUIZ</a>
            <a href="jogos.html" class="active">JOGOS</a>
            <a href="ranking.html">RANKING</a>
            <a href="perfil.html">PERFIL</a>
            <a href="sobrenos.html">SOBRE NÓS</a>
        </nav>

        <!-- Perfil à Direita -->
        <a href="perfil.html" class="perfil-externo">
            <img src="img/foto.png" class="foto-perfil" alt="Perfil">
        </a>
    </header>

    <main style="padding-top: 80px; margin-top: 0;">
        <section class="boas-vindas" style="padding-top: 20px !important; margin-top: 0 !important;">

            <div class="carousel-wrapper">

                        </div>

                    </div>

                </div>

                <button class="nav-btn next" id="btn-next">&#10095;</button>
            </div>
        </section>
    </main>

</body>
</html>
