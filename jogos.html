    <style>
        /* Remoção total de margens e espaçamentos no topo */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Topbar fixada diretamente no topo sem qualquer folga */
        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 25px !important;
            background-color: #4CAF50 !important;
            z-index: 1000 !important;
            margin: 0 !important;
        }

        /* Lado esquerdo: hambúrguer + (logo + barra de XP) */
        .topbar .left {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
        }

        /* Container vertical para empilhar Logo e XP */
        .topbar .info-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 6px !important;
        }

        /* Logo em tamanho padrão */
        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        /* Estilização da barra de nível e XP (Cor amarela de alto contraste - #FFDD55) */
        .topbar .level {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            color: #ffffff !important;
            font-size: 12px !important;
            font-weight: bold !important;
            line-height: 1 !important;
        }

        .topbar .level .star {
            color: #FFDD55 !important;
        }

        .topbar .level .bar {
            width: 120px !important;
            height: 10px !important;
            background-color: #2E7D32 !important;
            border-radius: 10px !important;
            overflow: hidden !important;
        }

        .topbar .level .progress {
            height: 100% !important;
            background-color: #FFDD55 !important;
            border-radius: 10px !important;
        }

        .topbar .level .xp {
            font-size: 11px !important;
            color: #ffffff !important;
            opacity: 0.95;
        }

        /* Menu de navegação */
        .topbar nav.menu {
            margin-left: auto !important;
            margin-right: 25px !important;
            display: flex !important;
            align-items: center !important;
            gap: 20px !important;
        }

        .topbar nav.menu a {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 15px !important;
            transition: color 0.2s ease !important;
            padding-bottom: 3px !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a:hover {
            color: #FFDD55 !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a.active {
            color: #ffffff !important;
            border-bottom: none !important;
        }

        /* Foto de perfil circular */
        .topbar .perfil-externo img,
        .topbar img.foto-perfil {
            width: 45px !important;
            height: 45px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            display: block !important;
            border: 2px solid #ffffff;
        }

        /* Compensação do conteúdo principal para a navbar fixada */
        main {
            margin-top: 90px !important;
            padding-top: 0 !important;
        }
    </style>
</head>

        <!-- Menu de Navegação Central -->

    </header>
