<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #ffffff !important;
        }

        /* =====================================================
           NAVBAR — MANTIDA COMO ESTAVA ORIGINALMENTE
           ===================================================== */

        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 25px !important;
            background-color: #4CAF50 !important;
            z-index: 1000 !important;
            margin: 0 !important;
        }

        .topbar-left {
            display: flex !important;
            align-items: center !important;
            width: 50px !important;
        }

        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        .topbar-right {
            width: 50px !important;
        }

        /* =====================================================
           SIDEBAR — NOVO MODELO
           ===================================================== */

        .sidebar .perfil-sidebar {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .sidebar .perfil-sidebar .mascote-icon {
            width: 70px !important;
            height: 70px !important;
            border-radius: 50% !important;
            background-color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 42px !important;
            line-height: 1 !important;
            margin-bottom: 8px !important;
        }

        .sidebar .perfil-sidebar p {
            margin: 0 !important;
        }

        /* Botões do Sidebar */

        .sidebar-actions {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
            width: 100% !important;
            margin-top: 25px !important;
        }

        .sidebar-actions .btn-principal {
            width: 100% !important;
            text-align: center !important;
            text-decoration: none !important;
        }

        /* ENTRAR — normal branco com fonte verde */

        .sidebar-actions .btn-secundario {
            background-color: #ffffff !important;
            color: #41af4b !important;
            border: 2px solid #ffffff !important;
        }

        /* ENTRAR — hover amarelo com fonte branca */

        .sidebar-actions .btn-secundario:hover {
            background-color: #FFDD55 !important;
            border-color: #FFDD55 !important;
            color: #ffffff !important;
        }

        /* CADASTRAR — normal branco com fonte verde */

        .sidebar-actions .btn-principal:not(.btn-secundario) {
            background-color: #ffffff !important;
            color: #41af4b !important;
            border: 2px solid #ffffff !important;
        }

        /* CADASTRAR — hover amarelo com fonte branca */

        .sidebar-actions .btn-principal:not(.btn-secundario):hover {
            background-color: #FFDD55 !important;
            border-color: #FFDD55 !important;
            color: #ffffff !important;
        }

        /* =====================================================
           COMPENSAÇÃO DO HEADER FIXO
           ===================================================== */

        main {
            margin-top: 90px !important;
            padding-top: 40px !important;
            min-height: calc(100vh - 150px) !important;
            background-color: #ffffff !important;
        }

        /* =====================================================
           CARDS
           ===================================================== */

        .escolha-card {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
        }

        .escolha-icone {
            display: block !important;
            width: 80px;
            height: 80px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0 auto 15px auto !important;
        }

        .aluno-card .escolha-icone {
            background-image: url('img/aluno.png');
        }

        .professor-card .escolha-icone {
            background-image: url('img/prof.png');
        }

        /* =====================================================
           RODAPÉ — MODELO DA ESCOLHA.HTML
           ===================================================== */

        footer {
            width: 100% !important;
            background-color: #4CAF50 !important;
            color: #ffffff !important;
            text-align: center !important;
            padding: 18px 20px !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }

        footer p {
            margin: 0 !important;
            color: #ffffff !important;
            font-family: 'Poppins', sans-serif !important;
            font-size: 14px !important;
        }
    </style>
</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="topbar">

        <input type="checkbox" id="menu-check" class="menu-checkbox">

        <label for="menu-check" class="overlay"></label>

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <span class="mascote-icon">🐢</span>

                <p>Visitante</p>

            </div>

            <div class="sidebar-actions">

                <a href="escolha.html"
                   class="btn-principal btn-secundario">
                    ENTRAR
                </a>

                <a href="escolha-cadastro.html"
                   class="btn-principal">
                    CADASTRAR
                </a>

            </div>

        </aside>

        <!-- Lado esquerdo -->

        <div class="topbar-left">

            <label for="menu-check"
                   class="hamburger"
                   aria-label="Abrir menu">

                <span></span>
                <span></span>
                <span></span>

            </label>

        </div>

        <!-- Logo central -->

        <div class="topbar-center">

            <div class="logo">

                <img src="img/cultsab.png"
                     alt="Cultivando o Saber"
                     class="navbar-logo">

            </div>

        </div>

        <!-- Espaço direito -->

        <div class="topbar-right"></div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main>

        <section class="boas-vindas"
            style="
                padding-top: 0 !important;
                margin-top: 0 !important;
                text-align: center;
                background: #ffffff !important;
                box-shadow: none !important;
            ">

            <h2
                style="
                    margin: 0 !important;
                    color: #41af4b !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                ">
                Crie sua conta
            </h2>

            <p
                class="sub-branco"
                style="
                    color: #000000 !important;
                    font-weight: normal !important;
                    margin-top: 8px;
                ">
                Você é:
            </p>


            <div
                class="escolha-container"
                style="
                    margin-top: 25px !important;
                    display: flex;
                    justify-content: center;
                    gap: 20px;
                    align-items: center;
                ">


                <!-- CARD ALUNO -->

                <div
                    class="escolha-card aluno-card"
                    onclick="window.location.href='cadastro.html'">

                    <span class="escolha-icone"></span>

                    <h2>Aluno</h2>

                </div>


                <!-- CARD GESTOR -->

                <div
                    class="escolha-card professor-card"
                    onclick="window.location.href='cadastro-professor.html'">

                    <span class="escolha-icone"></span>

                    <h2>Gestor</h2>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer>

        <p>© 2026 FATEC - Informática para Negócios</p>

    </footer>

</body>

</html>
