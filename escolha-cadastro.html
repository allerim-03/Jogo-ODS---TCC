<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">


    <!-- =====================================================
         FONTES
    ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         CSS DO PROJETO
    ===================================================== -->

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0 !important;
            padding: 0 !important;

            background-color: #ffffff !important;

            width: 100% !important;
            min-height: 100% !important;

        }


        /* =====================================================
           NAVBAR
           MANTIDA COMO ESTAVA NO ESCOLHA-CADASTRO
        ===================================================== */

        .topbar {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;

            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;

            align-items: center !important;
            justify-content: space-between !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;

            margin: 0 !important;

        }


        .topbar-left {

            display: flex !important;

            align-items: center !important;

            width: 50px !important;

        }


        .topbar-center {

            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;

            justify-content: center !important;

            align-items: center !important;

        }


        .topbar .navbar-logo {

            height: 38px !important;

            width: auto !important;

            display: block !important;

        }


        .topbar-right {

            width: 50px !important;

        }


        /* =====================================================
           SIDEBAR
           ESTRUTURA IGUAL À DO LOGIN
        ===================================================== */

        .menu-checkbox {

            display: none !important;

        }


        .sidebar {

            position: fixed !important;

            top: 0 !important;

            left: -300px !important;

            width: 270px !important;

            height: 100vh !important;

            background-color: #1b5e20 !important;

            z-index: 9999 !important;

            transition: left 0.3s ease !important;

            padding: 30px 20px !important;

            display: flex !important;

            flex-direction: column !important;

            box-sizing: border-box !important;

        }


        #menu-check:checked ~ .sidebar {

            left: 0 !important;

        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            background: rgba(0, 0, 0, 0.4) !important;

            z-index: 9998 !important;

            display: none !important;

        }


        #menu-check:checked ~ .overlay {

            display: block !important;

        }


        /* =====================================================
           HAMBÚRGUER
        ===================================================== */

        .hamburger {

            width: 42px !important;
            height: 42px !important;

            display: flex !important;

            flex-direction: column !important;

            justify-content: center !important;
            align-items: center !important;

            gap: 5px !important;

            cursor: pointer !important;

            border-radius: 8px !important;

            transition: opacity 0.2s ease !important;

        }


        .hamburger:hover {

            opacity: 0.85 !important;

        }


        .hamburger span {

            width: 24px !important;

            height: 3px !important;

            background-color: #FFFFFF !important;

            border-radius: 2px !important;

        }


        /* =====================================================
           PERFIL DO VISITANTE
           IGUAL AO LOGIN
        ===================================================== */

        .perfil-sidebar {

            text-align: center !important;

            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;

            padding-bottom: 20px !important;

            margin-bottom: 20px !important;

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;

        }


        /* =====================================================
           IMAGEM DA TUGA
           IGUAL AO LOGIN
        ===================================================== */

        .perfil-sidebar img.mascote-perfil {

            width: 65px !important;

            height: 65px !important;

            border-radius: 50% !important;

            object-fit: contain !important;

            border: 2px solid #FFFFFF !important;

            background-color: #FFFFFF !important;

            padding: 2px !important;

            margin-bottom: 10px !important;

            image-rendering: pixelated !important;

            display: block !important;

        }


        /* =====================================================
           VISITANTE
        ===================================================== */

        .perfil-sidebar p {

            color: #FFB72B !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 1.1rem !important;

            margin: 0 !important;

        }


        /* =====================================================
           BOTÕES DO SIDEBAR
           ESTRUTURA IGUAL AO LOGIN
        ===================================================== */

        .links-sidebar {

            display: flex !important;

            flex-direction: column !important;

            gap: 8px !important;

            width: 100% !important;

        }


        .links-sidebar a {

            width: 100% !important;

            text-decoration: none !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 16px !important;

            text-transform: uppercase !important;

            text-align: center !important;

            padding: 12px 16px !important;

            border-radius: 12px !important;

            transition:
                background-color 0.2s ease,
                color 0.2s ease !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            min-height: 62px !important;

        }


        /* =====================================================
           ENTRAR
        ===================================================== */

        .links-sidebar a.link-entrar {

            color: #FFFFFF !important;

            background-color: transparent !important;

            border: 2px solid #FFFFFF !important;

        }


        .links-sidebar a.link-entrar:hover {

            background-color: #FFDE5A !important;

            color: #FFFFFF !important;

            border-color: #FFDE5A !important;

        }


        /* =====================================================
           CADASTRAR
        ===================================================== */

        .links-sidebar a.link-cadastrar {

            color: #1b5e20 !important;

            background-color: #FFFFFF !important;

            border: 2px solid #FFFFFF !important;

        }


        .links-sidebar a.link-cadastrar:hover {

            background-color: #FFDE5A !important;

            color: #1b5e20 !important;

            border-color: #FFDE5A !important;

        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {

            margin-top: 90px !important;

            padding-top: 40px !important;

            min-height: calc(100vh - 175px) !important;

            background-color: #ffffff !important;

        }


        /* =====================================================
           CARDS
        ===================================================== */

        .escolha-card {

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;

            text-align: center !important;

        }


        .escolha-icone {

            display: block !important;

            width: 80px;

            height: 80px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            margin: 0 auto 15px auto !important;

        }


        .aluno-card .escolha-icone {

            background-image: url('img/aluno.png');

        }


        .professor-card .escolha-icone {

            background-image: url('img/prof.png');

        }


        /* =====================================================
           RODAPÉ
           LARGURA TOTAL DA PÁGINA, COMO NO INDEX
        ===================================================== */

        footer {

            width: 100% !important;

            min-width: 100% !important;

            height: 85px !important;

            min-height: 85px !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            background-color: #CCCCCC !important;

            margin: 0 !important;

            padding: 0 !important;

            border: none !important;

            box-shadow: none !important;

            text-align: center !important;

            position: relative !important;

            left: 0 !important;

        }


        footer p {

            margin: 0 !important;

            padding: 0 !important;

            color: #ffffff !important;

            font-family: 'Poppins', sans-serif !important;

            font-size: 18px !important;

            font-weight: 400 !important;

            text-align: center !important;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="topbar">


        <!-- CHECKBOX DO MENU -->

        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >


        <!-- OVERLAY -->

        <label
            for="menu-check"
            class="overlay"
        ></label>


        <!-- =================================================
             SIDEBAR
        ================================================= -->

        <aside class="sidebar">


            <!-- PERFIL DO VISITANTE -->

            <div class="perfil-sidebar">


                <!-- TUGA -->

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                    class="mascote-perfil"
                >


                <!-- NOME -->

                <p>
                    Visitante
                </p>


            </div>


            <!-- =================================================
                 BOTÕES
            ================================================= -->

            <nav class="links-sidebar">


                <!-- ENTRAR -->

                <a
                    href="escolha.html"
                    class="link-entrar"
                >

                    ENTRAR

                </a>


                <!-- CADASTRAR -->

                <a
                    href="escolha-cadastro.html"
                    class="link-cadastrar"
                >

                    CADASTRAR

                </a>


            </nav>


        </aside>


        <!-- =================================================
             LADO ESQUERDO / HAMBÚRGUER
        ================================================= -->

        <div class="topbar-left">


            <label
                for="menu-check"
                class="hamburger"
                aria-label="Abrir menu"
            >

                <span></span>

                <span></span>

                <span></span>

            </label>


        </div>


        <!-- =================================================
             LOGO CENTRAL
        ================================================= -->

        <div class="topbar-center">


            <div class="logo">


                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >


            </div>


        </div>


        <!-- =================================================
             LADO DIREITO
        ================================================= -->

        <div class="topbar-right"></div>


    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>


        <section
            class="boas-vindas"
            style="
                padding-top: 0 !important;
                margin-top: 0 !important;
                text-align: center;
                background: #ffffff !important;
                box-shadow: none !important;
            "
        >


            <!-- TÍTULO -->

            <h2
                style="
                    margin: 0 !important;
                    color: #41af4b !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                "
            >

                Crie sua conta

            </h2>


            <!-- SUBTÍTULO -->

            <p
                class="sub-branco"
                style="
                    color: #000000 !important;
                    font-weight: normal !important;
                    margin-top: 8px;
                "
            >

                Você é:

            </p>


            <!-- =================================================
                 CARDS DE ESCOLHA
            ================================================= -->

            <div
                class="escolha-container"
                style="
                    margin-top: 25px !important;
                    display: flex;
                    justify-content: center;
                    gap: 20px;
                    align-items: center;
                "
            >


                <!-- ALUNO -->

                <div
                    class="escolha-card aluno-card"
                    onclick="window.location.href='cadastro.html'"
                >


                    <span class="escolha-icone"></span>


                    <h2>
                        Aluno
                    </h2>


                </div>


                <!-- GESTOR -->

                <div
                    class="escolha-card professor-card"
                    onclick="window.location.href='cadastro-professor.html'"
                >


                    <span class="escolha-icone"></span>


                    <h2>
                        Gestor
                    </h2>


                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>


        <p>

            © 2026 FATEC - Informática para Negócios

        </p>


    </footer>


</body>

</html>
