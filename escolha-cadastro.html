<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #ffffff !important;
        }

        /* =====================================================
           NAVBAR
           Mantida como estava anteriormente
        ===================================================== */

        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;
            margin: 0 !important;
        }

        .topbar-left {
            display: flex !important;
            align-items: center !important;
            width: 50px !important;
        }

        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;

            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        .topbar-right {
            width: 50px !important;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            background-color: #1B6625 !important;
        }

        .perfil-sidebar {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;

            padding-top: 25px !important;
            padding-bottom: 20px !important;
        }

        /* Círculo branco da Tuga */
        .perfil-sidebar .mascote-icon {
            width: 88px !important;
            height: 88px !important;

            background-color: #ffffff !important;
            border-radius: 50% !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            overflow: hidden !important;

            font-size: 0 !important;

            margin-bottom: 10px !important;
        }

        /* Imagem da Tuga dentro do círculo */
        .perfil-sidebar .mascote-icon::before {
            content: "" !important;

            width: 70px !important;
            height: 70px !important;

            background-image: url('../img/TugaPqn.png') !important;
            background-size: contain !important;
            background-position: center !important;
            background-repeat: no-repeat !important;

            image-rendering: pixelated !important;
        }

        .perfil-sidebar p {
            color: #FFDD55 !important;
            font-family: 'Nunito', sans-serif !important;
            font-size: 24px !important;
            font-weight: 800 !important;

            margin: 0 !important;
        }

        /* Linha abaixo do perfil */
        .sidebar .perfil-sidebar::after {
            content: "" !important;

            display: block !important;

            width: calc(100% - 50px) !important;
            height: 1px !important;

            background-color: rgba(255, 255, 255, 0.25) !important;

            margin-top: 28px !important;
        }

        /* Área dos botões */
        .sidebar-actions {
            display: flex !important;
            flex-direction: column !important;
            gap: 15px !important;

            padding: 30px 25px 0 25px !important;
        }

        /* Botões padrão */
        .sidebar-actions a {
            width: 100% !important;
            height: 66px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background-color: #ffffff !important;

            border: none !important;
            border-radius: 15px !important;

            color: #41AF4B !important;

            font-family: 'Nunito', sans-serif !important;
            font-size: 20px !important;
            font-weight: 800 !important;

            text-decoration: none !important;

            transition: all 0.2s ease !important;
        }

        /* Hover dos botões */
        .sidebar-actions a:hover {
            background-color: #FFDD55 !important;
            color: #ffffff !important;
            transform: none !important;
        }

        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {
            margin-top: 90px !important;
            padding-top: 40px !important;

            min-height: calc(100vh - 150px) !important;

            background-color: #ffffff !important;
        }

        /* Alinhamento dos cards */
        .escolha-card {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
        }

        .escolha-icone {
            display: block !important;

            width: 80px;
            height: 80px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            margin: 0 auto 15px auto !important;
        }

        .aluno-card .escolha-icone {
            background-image: url('img/aluno.png');
        }

        .professor-card .escolha-icone {
            background-image: url('img/prof.png');
        }

        /* =====================================================
           RODAPÉ
           Modelo da imagem 2
        ===================================================== */

        footer {
            width: 100% !important;

            height: 85px !important;
            min-height: 85px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background-color: #CCCCCC !important;

            margin: 0 !important;
            padding: 0 !important;

            border: none !important;
            box-shadow: none !important;

            text-align: center !important;
        }

        footer p {
            margin: 0 !important;
            padding: 0 !important;

            color: #ffffff !important;

            font-family: 'Poppins', sans-serif !important;
            font-size: 18px !important;
            font-weight: 400 !important;

            text-align: center !important;
        }

    </style>
</head>

<body>

    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <header class="topbar">

        <input type="checkbox" id="menu-check" class="menu-checkbox">

        <label for="menu-check" class="overlay"></label>


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <span class="mascote-icon"></span>

                <p>Visitante</p>

            </div>


            <div class="sidebar-actions">

                <a href="escolha.html"
                   class="btn-principal btn-secundario">
                    ENTRAR
                </a>

                <a href="escolha-cadastro.html"
                   class="btn-principal">
                    CADASTRAR
                </a>

            </div>

        </aside>


        <!-- LADO ESQUERDO -->

        <div class="topbar-left">

            <label for="menu-check"
                   class="hamburger"
                   aria-label="Abrir menu">

                <span></span>
                <span></span>
                <span></span>

            </label>

        </div>


        <!-- LOGO CENTRAL -->

        <div class="topbar-center">

            <div class="logo">

                <img src="img/cultsab.png"
                     alt="Cultivando o Saber"
                     class="navbar-logo">

            </div>

        </div>


        <!-- LADO DIREITO -->

        <div class="topbar-right"></div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>

        <section class="boas-vindas"
                 style="
                    padding-top: 0 !important;
                    margin-top: 0 !important;
                    text-align: center;
                    background: #ffffff !important;
                    box-shadow: none !important;
                 ">

            <h2 style="
                margin: 0 !important;
                color: #41af4b !important;
                font-family: 'Nunito', sans-serif;
                font-size: 2.2rem;
                font-weight: 800;
            ">
                Crie sua conta
            </h2>


            <p class="sub-branco"
               style="
                    color: #000000 !important;
                    font-weight: normal !important;
                    margin-top: 8px;
               ">
                Você é:
            </p>


            <div class="escolha-container"
                 style="
                    margin-top: 25px !important;
                    display: flex;
                    justify-content: center;
                    gap: 20px;
                    align-items: center;
                 ">


                <!-- ALUNO -->

                <div class="escolha-card aluno-card"
                     onclick="window.location.href='cadastro.html'">

                    <span class="escolha-icone"></span>

                    <h2>Aluno</h2>

                </div>


                <!-- GESTOR -->

                <div class="escolha-card professor-card"
                     onclick="window.location.href='cadastro-professor.html'">

                    <span class="escolha-icone"></span>

                    <h2>Gestor</h2>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>

</body>

</html>
