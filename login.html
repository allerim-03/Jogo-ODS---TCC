<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivando o Saber - Login Aluno</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>
        /* Ajuste isolado apenas para centralizar a logo e ocultar os botões da direita na navbar */
        .topbar {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            position: relative !important;
        }

        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
        }

        .topbar-right {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Garante nitidez absoluta em Pixel Art para o mascote */
        .login-box img {
            image-rendering: -moz-crisp-edges !important;
            image-rendering: -webkit-optimize-contrast !important;
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
            width: 70px;
            height: auto;
            margin: 0 auto 10px auto;
            display: block;
        }
    </style>
</head>

<body>
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

    <main style="margin-top: 100px !important; padding-top: 0 !important; margin-bottom: 20px !important;">

        <section class="boas-vindas" style="background: transparent !important; box-shadow: none !important; padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
            
            <h2 style="margin: 0 0 15px 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Acesso do Aluno</h2>

            <!-- Caixa do formulário isolada com leve sombreado -->
            <div class="login-box" style="max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);">
                
                <img src="img/TugaPqn.png" alt="Mascote Tuga">

                <h1 class="texto-azul negrito" style="font-size: 1.5rem; margin-bottom: 20px;">Login</h1>

                <form class="form-grid" style="text-align: left;">
                    <div class="form-field col-full" style="margin-bottom: 15px;">
                        <label for="email_aluno">Email</label>
                        <div class="input-group">
                            <input type="email" id="email_aluno" name="email" placeholder="Digite seu email" required>
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        </div>
                    </div>
                    
                    <div class="form-field col-full" style="margin-bottom: 15px;">
                        <label for="senha_aluno">Senha</label>
                        <div class="input-group">
                            <input type="password" id="senha_aluno" name="senha" placeholder="Digite sua senha" required>
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                    </div>
                    
                    <div class="form-field col-full" style="margin-top: 10px;">
                        <button type="submit" class="btn-submit btn-azul" style="width: 100%;">Entrar</button>
                    </div>
                </form>

                <p style="margin-top: 20px; color:#555;">
                    Não tem uma conta? <a href="cadastro.html" class="texto-azul negrito">Cadastre-se aqui</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>
</body>
</html>
