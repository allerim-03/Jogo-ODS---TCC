<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivando o Saber - Login Aluno</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">
</head>

<body>
<!-- TOPBAR / NAVBAR (IDÊNTICO À HOME.HTML) -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <!-- 1. Esquerda: Menu Hamburger -->
        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <!-- 2. Centro: Logotipo Centralizado com cultsab.png -->
        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <!-- 3. Direita: Ações de Login/Cadastro -->
        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

<main style="margin-top: 100px !important; padding-top: 0 !important; min-height: auto !important; height: auto !important;">

    <section class="boas-vindas" style="padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
        <h2 style="margin: 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Acesso do Aluno</h2>

        <div class="login-box">
            <img src="img/TugaPqn.png" alt="Mascote Tuga">

            <h1 class="texto-azul negrito">Login</h1>

            <form>
                <label for="email_aluno">Email</label>
                <input type="email" id="email_aluno" name="email" placeholder="Digite seu email" required>
                
                <label for="senha_aluno">Senha</label>
                <input type="password" id="senha_aluno" name="senha" placeholder="Digite sua senha" required>
                
                <button type="submit" class="btn-azul">Entrar</button>
            </form>

            <p style="margin-top:10px; color:#555;">
                Não tem uma conta? <a href="cadastro.html" class="texto-azul negrito">Cadastre-se aqui</a>
            </p>

            <!-- Caixinha de Dica com o estilo em Azul -->
            <div style="background-color: #f0f7ff; border: 1.5px solid #82c2f5; border-radius: 12px; padding: 10px; margin-top: 15px; text-align: center;">
                <p style="margin: 0; color: #2c3e50; font-size: 0.9rem;"><strong>Dica:</strong> Preencha todos os campos obrigatórios!</p>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 FATEC - Informática para Negócios</p>
</footer>
</body>
</html>
