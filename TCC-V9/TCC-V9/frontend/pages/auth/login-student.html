<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Cultivando o Saber - Login Aluno</title>
    <link href="/assets/img/icon.png" rel="icon" />
    <link href="/assets/css/design-system.css" rel="stylesheet" />
    <script src="/config.js"></script>
    <script src="/assets/js/services/api.js"></script>
    <script src="/assets/js/core/routes.js"></script>
    <script defer="" src="/assets/js/components/layout.js"></script>
    <script defer="" src="/assets/js/core/app.js"></script>
    <script defer="" src="/assets/js/components/enhancements.js"></script>
  </head>
  <body data-page="login.html">
    <a class="skip-link" href="#main-content">Ir para o conteúdo</a>
    <div class="platform-shell">
      <header id="site-header"></header>
      <div class="platform-content">
        <main id="main-content" tabindex="-1">
          <a class="back-link" href="/entrar">← Escolher outro perfil</a>
          <section class="boas-vindas">
            <h2>Acesso do Aluno</h2>
            <div class="login-box">
              <img alt="Mascote Tuga" src="/assets/img/TugaPqn.png" />
              <h1 class="texto-azul negrito">Login</h1>
              <form class="form-grid">
                <div class="form-field col-full">
                  <label for="email_aluno">Nome completo</label>
                  <div class="input-group">
                    <input
                      autocomplete="username"
                      id="email_aluno"
                      placeholder="Digite seu nome e sobrenome"
                      required=""
                      type="text"
                    />
                  </div>
                </div>
                <div class="form-field col-full">
                  <label for="senha_aluno">Senha</label>
                  <div class="input-group">
                    <input
                      autocomplete="current-password"
                      id="senha_aluno"
                      required=""
                      type="password"
                    />
                  </div>
                </div>
                <button class="btn-principal">Entrar</button>
                <p>Esqueceu a senha? Peça ao seu professor para redefini-la.</p>
              </form>
              <p>
                Não tem uma conta?

                <a class="texto-azul negrito" href="/cadastro/aluno">
                  Cadastre-se aqui
                </a>
              </p>
            </div>
          </section>
        </main>
        <footer class="site-footer">
          <a href="/">Cultivando o Saber</a
          ><span>Aprender. Cuidar. Transformar.</span
          ><small>© 2026 · FATEC São Bernardo do Campo</small>
        </footer>
      </div>
    </div>
  </body>
</html>
