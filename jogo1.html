<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivando o Saber - Jogo 1</title>
<!-- Favicon / Ícone da guia -->
<link rel="icon" type="image/png" href="img/icon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Topbar Padronizada Fixa */
        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 25px !important;
            background-color: #4CAF50 !important;
            z-index: 1000 !important;
            margin: 0 !important;
        }

        /* Lado Esquerdo */
        .topbar .left {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
        }

        .topbar .info-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 6px !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        /* Nível e Barra de Experiência */
        .topbar .level {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            color: #ffffff !important;
            font-size: 12px !important;
            font-weight: bold !important;
            line-height: 1 !important;
        }

        .topbar .level .star {
            color: #FFDD55 !important;
        }

        .topbar .level .bar {
            width: 120px !important;
            height: 10px !important;
            background-color: #2E7D32 !important;
            border-radius: 10px !important;
            overflow: hidden !important;
        }

        .topbar .level .progress {
            height: 100% !important;
            background-color: #FFDD55 !important;
            border-radius: 10px !important;
        }

        .topbar .level .xp {
            font-size: 11px !important;
            color: #ffffff !important;
            opacity: 0.95;
        }

        /* Menu Central */
        .topbar nav.menu {
            margin-left: auto !important;
            margin-right: 25px !important;
            display: flex !important;
            align-items: center !important;
            gap: 20px !important;
        }

        .topbar nav.menu a {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 15px !important;
            transition: color 0.2s ease !important;
            padding-bottom: 3px !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a:hover {
            color: #FFDD55 !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a.active {
            color: #ffffff !important;
            border-bottom: none !important;
        }

        /* Perfil Circular à Direita */
        .topbar .perfil-externo img,
        .topbar img.foto-perfil {
            width: 45px !important;
            height: 45px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            display: block !important;
            border: 2px solid #ffffff;
        }

        /* Compensação e Layout Principal */
        main {
            margin-top: 90px !important;
            padding-top: 0 !important;
            min-height: auto !important;
            height: auto !important;
        }

        /* Estilização da Tela do Jogo */
        .jogo-foco-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 40px 20px;
        }

        .canvas-gameplay {
            background-color: #111;
            border: 4px solid #f39c12;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR PADRONIZADA -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <aside class="sidebar">
            <div class="perfil-sidebar">
                <img src="img/foto.png" class="foto-perfil" alt="Foto de perfil">
                <p>Nível 2</p>
            </div>

            <nav class="links-sidebar">
                <a href="index.html">HOME</a>
                <a href="ods.html">ODS</a>
                <a href="quiz.html">QUIZ</a>
                <a href="jogos.html">JOGOS</a>
                <a href="ranking.html">RANKING</a>
                <a href="perfil.html">PERFIL</a>
                <a href="sobrenos.html">SOBRE NÓS</a>
            </nav>
        </aside>

        <!-- Lado Esquerdo -->
        <div class="left">
            <label for="menu-check" class="hamburger" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <div class="info-container">
                <div class="logo">
                    <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
                </div>

                <div class="level">
                    <span class="star">★ NÍVEL 2</span>
                    <div class="bar">
                        <div class="progress" style="width: 45%;"></div>
                    </div>
                    <span class="xp">450/1000</span>
                </div>
            </div>
        </div>

        <!-- Menu de Navegação Central -->
        <nav class="menu">
            <a href="index.html">HOME</a>
            <a href="ods.html">ODS</a>
            <a href="quiz.html">QUIZ</a>
            <a href="jogos.html" class="active">JOGOS</a>
            <a href="ranking.html">RANKING</a>
            <a href="perfil.html">PERFIL</a>
            <a href="sobrenos.html">SOBRE NÓS</a>
        </nav>

        <!-- Perfil à Direita -->
        <a href="perfil.html" class="perfil-externo">
            <img src="img/foto.png" class="foto-perfil" alt="Perfil">
        </a>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="boas-vindas jogo-foco-container" style="padding-top: 20px !important; margin-top: 0 !important;">
            <h2 style="margin-top: 0 !important; color: #4CAF50 !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800; text-align: center;">Teste Jogo 1: Ciclo da Água</h2>
            <p style="text-align: center;">Ajude o Gota a completar sua jornada no ciclo da água!</p>
            
            <canvas id="canvas-jogo-1" width="600" height="400" class="canvas-gameplay"></canvas>
            
            <br>
            <a href="jogos.html" class="btn-login" style="text-decoration: none; padding: 10px 20px;">Voltar para Jogos</a>
        </section>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

    <!-- Importações dos Módulos do Jogo 1 -->
    <script src="js/jogo1/controles.js"></script>
    <script src="js/jogo1/interativos.js"></script>
    <script src="js/jogo1/plataformas.js"></script>
    <script src="js/jogo1/player.js"></script>
    <script src="js/jogo1/cenario.js"></script>

    <!-- Script Controlador Principal -->
    <script src="js/jogo1.js"></script>

</body>
</html>
