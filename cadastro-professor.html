<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Gestor - Cultivando o Saber</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>
        /* Força a exibição correta e centralizada da barra de navegação */
        header.topbar {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            align-items: center !important;
            justify-content: space-between !important;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        /* Centraliza perfeitamente a logo */
        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
        }

        /* Remove apenas os botões da direita mantendo o espaço equilibrado */
        .topbar-right {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

    <main style="margin-top: 110px !important;">
        <div class="auth-container">
            
            <div class="auth-sidebar professor-theme">
                <img src="img/TugaPqn.png" alt="Mascote Tuga" class="mascote">
                <h2>Bem-vindo!</h2>
                <p>Acompanhe o desempenho da sua turma e gerencie seus alunos em um só lugar.</p>
                <p style="font-size: 0.85rem; margin-bottom: 15px;">Já possui uma conta?</p>
                <a href="login-professor.html" class="btn-outline">ENTRAR</a>
            </div>

            <div class="auth-content">
                <h1>Cadastro do Gestor</h1>

                <form class="form-grid">
                    <div class="form-field col-full">
                        <label for="name_user">Nome Completo</label>
                        <div class="input-group">
                            <input type="text" id="name_user" name="name_user" placeholder="Digite seu nome completo" required>
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="id_gender">Gênero</label>
                        <div class="input-group">
                            <select id="id_gender" name="id_gender" required>
                                <option value="" disabled selected>Selecione</option>
                                <option value="1">Feminino</option>
                                <option value="2">Masculino</option>
                                <option value="3">Não-binário</option>
                                <option value="4">Prefiro não informar</option>
                            </select>
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="birth_user">Nascimento</label>
                        <div class="input-group">
                            <input type="date" id="birth_user" name="birth_user" required>
                            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                        </div>
                    </div>

                    <div class="form-field col-full">
                        <label for="registration_user">Número da Matrícula (Opcional)</label>
                        <div class="input-group">
                            <input type="text" id="registration_user" name="registration_user" placeholder="Digite a matrícula">
                            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="main_email">E-mail Organizacional</label>
                        <div class="input-group">
                            <input type="email" id="main_email" name="main_email" placeholder="nome@organizacao.com" required>
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="personal_email">E-mail Secundário</label>
                        <div class="input-group">
                            <input type="email" id="personal_email" name="personal_email" placeholder="nome@gmail.com" required>
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="password_user">Senha</label>
                        <div class="input-group">
                            <input type="password" id="password_user" name="password_user" placeholder="Sua senha" required>
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="confirm_password">Confirmar Senha</label>
                        <div class="input-group">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field col-full" style="margin-top: 10px;">
                        <button type="submit" class="btn-submit">CADASTRAR</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

</body>
</html>
