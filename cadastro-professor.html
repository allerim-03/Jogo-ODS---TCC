<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Gestor - Cultivando o Saber</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">
</head>

<body>
<!-- TOPBAR / NAVBAR (IDÊNTICO À HOME.HTML) -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <!-- 1. Esquerda: Menu Hamburger -->
        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <!-- 2. Centro: Logotipo Centralizado com cultsab.png -->
        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <!-- 3. Direita: Ações de Login/Cadastro -->
        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

    <main style="margin-top: 100px !important; padding-top: 0 !important; min-height: auto !important; height: auto !important;">
        <section class="boas-vindas" style="padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
            <h2 class="titulo-branco" style="margin: 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Bem-vindo!</h2>
            <p class="sub-branco" style="color: #000000 !important; font-weight: normal !important; margin-top: 8px;">Acompanhe o desempenho da sua turma</p>
            
            <div class="login-box professor-box">

                <img src="img/TugaPqn.png" alt="Mascote Tuga">
                <h1 class="negrito">Cadastro do Gestor</h1>

                <form>
                    <!-- name_user -->
                    <label for="name_user">Nome</label>
                    <input type="text" id="name_user" name="name_user" placeholder="Digite o nome completo" required>

                    <!-- id_gender -->
                    <label for="id_gender">Gênero</label>
                    <select id="id_gender" name="id_gender" required>
                        <option value="" disabled selected>Selecione o gênero</option>
                        <option value="1">Feminino</option>
                        <option value="2">Masculino</option>
                        <option value="3">Não-binário</option>
                        <option value="4">Prefiro não informar</option>
                    </select>

                    <!-- birth_user -->
                    <label for="birth_user">Data de Nascimento</label>
                    <input type="date" id="birth_user" name="birth_user" required>

                    <!-- registration_user -->
                    <label for="registration_user">Número da Matrícula (Opcional)</label>
                    <input type="text" id="registration_user" name="registration_user" placeholder="Digite a matrícula">

                    <!-- main_email -->
                    <label for="main_email">E-mail Organizacional</label>
                    <input type="email" id="main_email" name="main_email" placeholder="exemplo@organizacao.com" required>

                    <!-- personal_email -->
                    <label for="personal_email">E-mail Secundário</label>
                    <input type="email" id="personal_email" name="personal_email" placeholder="exemplo@gmail.com" required>

                    <!-- password_user -->
                    <label for="password_user">Senha</label>
                    <input type="password" id="password_user" name="password_user" placeholder="Escolha a senha" required>

                    <!-- confirmação -->
                    <label for="confirm_password">Confirmação de Senha</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme sua senha" required>

                    <button type="submit">Criar</button>
                </form>

                <p class="cadastro">Já tem uma conta? <a href="login-professor.html" class="negrito">Faça login aqui</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

</body>
</html>
