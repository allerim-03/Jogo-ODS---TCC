<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Gestor - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">


    <style>

        /* =====================================================
           NAVBAR
           ===================================================== */

        .topbar {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;

            margin: 0 !important;
        }


        .topbar-left {
            display: flex !important;
            align-items: center !important;

            width: 50px !important;
        }


        .topbar-center {
            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }


        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;

            display: block !important;
        }


        .topbar-right {
            width: 50px !important;

            visibility: hidden !important;
            pointer-events: none !important;
        }



        /* =====================================================
           SIDEBAR — IGUAL AO LOGIN
           ===================================================== */

        .menu-checkbox {
            display: none !important;
        }


        .sidebar {
            position: fixed !important;

            top: 0 !important;
            left: -300px !important;

            width: 270px !important;
            height: 100vh !important;

            background-color: #1b5e20 !important;

            z-index: 9999 !important;

            transition: left 0.3s ease !important;

            padding: 30px 20px !important;

            display: flex !important;
            flex-direction: column !important;

            box-sizing: border-box !important;
        }


        #menu-check:checked ~ .sidebar {
            left: 0 !important;
        }



        /* =====================================================
           OVERLAY
           ===================================================== */

        .overlay {
            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            background: rgba(0, 0, 0, 0.4) !important;

            z-index: 9998 !important;

            display: none !important;
        }


        #menu-check:checked ~ .overlay {
            display: block !important;
        }



        /* =====================================================
           HAMBÚRGUER
           ===================================================== */

        .hamburger {
            width: 42px !important;
            height: 42px !important;

            display: flex !important;
            flex-direction: column !important;

            justify-content: center !important;
            align-items: center !important;

            gap: 5px !important;

            cursor: pointer !important;

            border-radius: 8px !important;

            transition: opacity 0.2s ease !important;
        }


        .hamburger:hover {
            opacity: 0.85 !important;
        }


        .hamburger span {
            width: 24px !important;
            height: 3px !important;

            background-color: #FFFFFF !important;

            border-radius: 2px !important;
        }



        /* =====================================================
           PERFIL DO VISITANTE
           ===================================================== */

        .perfil-sidebar {
            text-align: center !important;

            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;

            padding-bottom: 20px !important;

            margin-bottom: 20px !important;

            display: flex !important;
            flex-direction: column !important;

            align-items: center !important;
        }


        .perfil-sidebar .mascote-perfil {
            width: 65px !important;
            height: 65px !important;

            border-radius: 50% !important;

            object-fit: contain !important;

            border: 2px solid #FFFFFF !important;

            background-color: #FFFFFF !important;

            padding: 2px !important;

            margin-bottom: 10px !important;

            image-rendering: pixelated !important;

            display: block !important;
        }


        .perfil-sidebar p {
            color: #FFB72B !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 1.1rem !important;

            margin: 0 !important;
        }



        /* =====================================================
           BOTÕES DA SIDEBAR
           ===================================================== */

        .links-sidebar {
            display: flex !important;

            flex-direction: column !important;

            gap: 8px !important;

            width: 100% !important;
        }


        .links-sidebar a {
            width: 100% !important;

            text-decoration: none !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 16px !important;

            text-transform: uppercase !important;

            text-align: center !important;

            padding: 12px 16px !important;

            border-radius: 12px !important;

            transition:
                background-color 0.2s ease,
                color 0.2s ease !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            min-height: 62px !important;
        }



        /* =====================================================
           ENTRAR — SIDEBAR
           ===================================================== */

        .links-sidebar a.link-entrar {
            color: #FFFFFF !important;

            background-color: transparent !important;

            border: 2px solid #FFFFFF !important;
        }


        .links-sidebar a.link-entrar:hover {
            background-color: #FFDE5A !important;

            color: #FFFFFF !important;

            border-color: #FFDE5A !important;
        }



        /* =====================================================
           CADASTRAR — SIDEBAR
           ===================================================== */

        .links-sidebar a.link-cadastrar {
            color: #1b5e20 !important;

            background-color: #FFFFFF !important;

            border: 2px solid #FFFFFF !important;
        }


        .links-sidebar a.link-cadastrar:hover {
            background-color: #FFDE5A !important;

            color: #1b5e20 !important;

            border-color: #FFDE5A !important;
        }



        /* =====================================================
           ÁREA DE CADASTRO
           
           IMPORTANTE:
           ESTAS REGRAS PRESERVAM AS CORES ORIGINAIS
           DO FORMULÁRIO.
           ===================================================== */

        .auth-sidebar h2 {
            color: #FFFFFF !important;
        }


        .auth-sidebar .btn-outline {
            background-color: #FFFFFF !important;

            color: #38bdf8 !important;

            border-color: #FFFFFF !important;
        }


        .auth-sidebar .btn-outline:hover {
            background-color: #f0f0f0 !important;

            color: #0284c7 !important;

            border-color: #f0f0f0 !important;
        }


        .auth-sidebar .mascote {
            image-rendering: -moz-crisp-edges !important;
            image-rendering: -webkit-optimize-contrast !important;
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
        }

    </style>
</head>


<body>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="topbar">

        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >


        <label
            for="menu-check"
            class="overlay"
        ></label>



        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                    class="mascote-perfil"
                >

                <p>Visitante</p>

            </div>


            <nav class="links-sidebar">

                <a
                    href="escolha.html"
                    class="link-entrar"
                >
                    ENTRAR
                </a>


                <a
                    href="escolha-cadastro.html"
                    class="link-cadastrar"
                >
                    CADASTRAR
                </a>

            </nav>

        </aside>



        <!-- =================================================
             HAMBÚRGUER
             ================================================= -->

        <div class="topbar-left">

            <label
                for="menu-check"
                class="hamburger"
                aria-label="Abrir menu"
            >

                <span></span>
                <span></span>
                <span></span>

            </label>

        </div>



        <!-- =================================================
             LOGO CENTRAL
             ================================================= -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>



        <!-- =================================================
             LADO DIREITO
             ================================================= -->

        <div class="topbar-right"></div>

    </header>



    <!-- =====================================================
         CONTEÚDO ORIGINAL DO CADASTRO DO GESTOR
         NÃO ALTERADO
         ===================================================== -->

    <main style="margin-top: 110px !important;">

        <div class="auth-container">


            <div class="auth-sidebar professor-theme">

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                    class="mascote"
                >


                <h2>Bem-vindo!</h2>


                <p>
                    Acompanhe o desempenho da sua turma e gerencie seus alunos em um só lugar.
                </p>


                <p style="font-size: 0.85rem; margin-bottom: 15px;">
                    Já possui uma conta?
                </p>


                <a
                    href="login-professor.html"
                    class="btn-outline"
                >
                    ENTRAR
                </a>

            </div>



            <div class="auth-content">

                <h1>Cadastro do Gestor</h1>


                <form class="form-grid">


                    <div class="form-field col-full">

                        <label for="name_user">
                            Nome Completo
                        </label>

                        <div class="input-group">

                            <input
                                type="text"
                                id="name_user"
                                name="name_user"
                                placeholder="Digite seu nome completo"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="id_gender">
                            Gênero
                        </label>

                        <div class="input-group">

                            <select
                                id="id_gender"
                                name="id_gender"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Selecione
                                </option>

                                <option value="1">
                                    Feminino
                                </option>

                                <option value="2">
                                    Masculino
                                </option>

                                <option value="3">
                                    Não-binário
                                </option>

                                <option value="4">
                                    Prefiro não informar
                                </option>

                            </select>


                            <svg viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="birth_user">
                            Nascimento
                        </label>

                        <div class="input-group">

                            <input
                                type="date"
                                id="birth_user"
                                name="birth_user"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.89 2-2V5c0-1.1-.89-2-2-2zm0 16H5V8h14v11z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field col-full">

                        <label for="registration_user">
                            Número da Matrícula (Opcional)
                        </label>

                        <div class="input-group">

                            <input
                                type="text"
                                id="registration_user"
                                name="registration_user"
                                placeholder="Digite a matrícula"
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="main_email">
                            E-mail Organizacional
                        </label>

                        <div class="input-group">

                            <input
                                type="email"
                                id="main_email"
                                name="main_email"
                                placeholder="nome@organizacao.com"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="personal_email">
                            E-mail Secundário
                        </label>

                        <div class="input-group">

                            <input
                                type="email"
                                id="personal_email"
                                name="personal_email"
                                placeholder="nome@gmail.com"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="password_user">
                            Senha
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                id="password_user"
                                name="password_user"
                                placeholder="Sua senha"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>

                        </div>

                    </div>



                    <div class="form-field">

                        <label for="confirm_password">
                            Confirmar Senha
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Repita a senha"
                                required
                            >

                            <svg viewBox="0 0 24 24">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>

                        </div>

                    </div>



                    <div
                        class="form-field col-full"
                        style="margin-top: 10px;"
                    >

                        <button
                            type="submit"
                            class="btn-submit"
                        >
                            CADASTRAR
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </main>



    <!-- =====================================================
         RODAPÉ ORIGINAL
         ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


</body>
</html>
