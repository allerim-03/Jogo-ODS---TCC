               <form>
    <!-- name_user -->
    <label for="name_user">Nome</label>
    <input type="text" id="name_user" name="name_user" placeholder="Digite o nome completo" required>

    <!-- id_gender -->
    <label for="id_gender">Gênero</label>
    <select id="id_gender" name="id_gender" required>
        <option value="" disabled selected>Selecione o gênero</option>
        <option value="1">Feminino</option>
        <option value="2">Masculino</option>
        <option value="3">Não-binário</option>
        <option value="4">Prefiro não informar</option>
    </select>

    <!-- birth_user -->
    <label for="birth_user">Data de Nascimento</label>
    <input type="date" id="birth_user" name="birth_user" required>

    <!-- registration_user -->
    <label for="registration_user">Número da Matrícula (Opcional)</label>
    <input type="text" id="registration_user" name="registration_user" placeholder="Digite a matrícula">

    <!-- main_email -->
    <label for="main_email">E-mail Organizacional</label>
    <input type="email" id="main_email" name="main_email" placeholder="exemplo@organizacao.com" required>

    <!-- personal_email -->
    <label for="personal_email">E-mail Secundário</label>
    <input type="email" id="personal_email" name="personal_email" placeholder="exemplo@gmail.com" required>

    <!-- password_user -->
    <label for="password_user">Senha</label>
    <input type="password" id="password_user" name="password_user" placeholder="Escolha a senha" required>

    <!-- confirmação (usada apenas no front-end para validação) -->
    <label for="confirm_password">Confirmação de Senha</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme sua senha" required>

    <button type="submit">Criar</button>
</form>
