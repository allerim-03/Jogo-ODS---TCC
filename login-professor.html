<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login do Gestor - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #ffffff !important;
        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .topbar {
            display: flex !important;

            align-items: center !important;

            justify-content: space-between !important;

            position: relative !important;

            width: 100% !important;

            height: 90px !important;

            min-height: 90px !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;

            margin: 0 !important;
        }


        /* =====================================================
           LADO ESQUERDO
           ===================================================== */

        .topbar-left {
            display: flex !important;

            align-items: center !important;

            width: 50px !important;
        }


        /* =====================================================
           LOGO CENTRALIZADA
           ===================================================== */

        .topbar-center {
            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;

            justify-content: center !important;

            align-items: center !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;

            width: auto !important;

            display: block !important;
        }


        /* =====================================================
           LADO DIREITO OCULTO
           ===================================================== */

        .topbar-right {
            width: 50px !important;

            visibility: hidden !important;

            pointer-events: none !important;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .menu-checkbox {
            display: none !important;
        }

        .sidebar {
            position: fixed !important;

            top: 0 !important;

            left: -300px !important;

            width: 270px !important;

            height: 100vh !important;

            background-color: #1b5e20 !important;

            z-index: 9999 !important;

            transition: left 0.3s ease !important;

            padding: 30px 20px !important;

            display: flex !important;

            flex-direction: column !important;

            box-sizing: border-box !important;
        }


        /* ABRIR SIDEBAR */

        #menu-check:checked ~ .sidebar {
            left: 0 !important;
        }


        /* =====================================================
           OVERLAY
           ===================================================== */

        .overlay {
            position: fixed !important;

            top: 0 !important;

            left: 0 !important;

            width: 100% !important;

            height: 100% !important;

            background: rgba(0, 0, 0, 0.4) !important;

            z-index: 9998 !important;

            display: none !important;
        }

        #menu-check:checked ~ .overlay {
            display: block !important;
        }


        /* =====================================================
           HAMBÚRGUER
           ===================================================== */

        .hamburger {
            width: 42px !important;

            height: 42px !important;

            display: flex !important;

            flex-direction: column !important;

            justify-content: center !important;

            align-items: center !important;

            gap: 5px !important;

            cursor: pointer !important;

            border-radius: 8px !important;

            transition: opacity 0.2s ease !important;
        }

        .hamburger:hover {
            opacity: 0.85 !important;
        }

        .hamburger span {
            width: 24px !important;

            height: 3px !important;

            background-color: #FFFFFF !important;

            border-radius: 2px !important;
        }


        /* =====================================================
           PERFIL DO VISITANTE
           ===================================================== */

        .perfil-sidebar {
            text-align: center !important;

            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;

            padding-bottom: 20px !important;

            margin-bottom: 20px !important;

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;
        }


        /* CÍRCULO BRANCO DA TUGA */

        .perfil-sidebar img.mascote-perfil {
            width: 65px !important;

            height: 65px !important;

            border-radius: 50% !important;

            object-fit: contain !important;

            border: 2px solid #FFFFFF !important;

            background-color: #FFFFFF !important;

            padding: 2px !important;

            margin-bottom: 10px !important;

            image-rendering: pixelated !important;

            display: block !important;
        }


        /* TEXTO VISITANTE */

        .perfil-sidebar p {
            color: #FFB72B !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 1.1rem !important;

            margin: 0 !important;
        }


        /* =====================================================
           LINKS DA SIDEBAR
           ===================================================== */

        .links-sidebar {
            display: flex !important;

            flex-direction: column !important;

            gap: 8px !important;

            width: 100% !important;
        }

        .links-sidebar a {
            width: 100% !important;

            text-decoration: none !important;

            font-family: 'Montserrat', sans-serif !important;

            font-weight: 700 !important;

            font-size: 16px !important;

            text-transform: uppercase !important;

            text-align: center !important;

            padding: 12px 16px !important;

            border-radius: 12px !important;

            transition:
                background-color 0.2s ease,
                color 0.2s ease !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            min-height: 62px !important;
        }


        /* =====================================================
           BOTÃO ENTRAR - NORMAL
           ===================================================== */

        .links-sidebar a.link-entrar {
            color: #FFFFFF !important;

            background-color: transparent !important;

            border: 2px solid #FFFFFF !important;
        }


        /* =====================================================
           BOTÃO ENTRAR - HOVER
           ===================================================== */

        .links-sidebar a.link-entrar:hover {
            background-color: #FFDE5A !important;

            color: #FFFFFF !important;

            border-color: #FFDE5A !important;
        }


        /* =====================================================
           BOTÃO CADASTRAR - NORMAL
           ===================================================== */

        .links-sidebar a.link-cadastrar {
            color: #1b5e20 !important;

            background-color: #FFFFFF !important;

            border: 2px solid #FFFFFF !important;
        }


        /* =====================================================
           BOTÃO CADASTRAR - HOVER
           ===================================================== */

        .links-sidebar a.link-cadastrar:hover {
            background-color: #FFDE5A !important;

            color: #1b5e20 !important;

            border-color: #FFDE5A !important;
        }


        /* =====================================================
           NITIDEZ DA TUGA DENTRO DO LOGIN
           ===================================================== */

        .login-box img {
            image-rendering: -moz-crisp-edges !important;

            image-rendering: -webkit-optimize-contrast !important;

            image-rendering: pixelated !important;

            image-rendering: crisp-edges !important;

            width: 70px;

            height: auto;

            margin: 0 auto 10px auto;

            display: block;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOPBAR / NAVBAR
         ===================================================== -->

    <header class="topbar">

        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >

        <label
            for="menu-check"
            class="overlay"
        ></label>


        <!-- =================================================
             SIDEBAR DO VISITANTE
             ================================================= -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                    class="mascote-perfil"
                >

                <p>Visitante</p>

            </div>


            <nav class="links-sidebar">

                <a
                    href="escolha.html"
                    class="link-entrar"
                >
                    ENTRAR
                </a>

                <a
                    href="escolha-cadastro.html"
                    class="link-cadastrar"
                >
                    CADASTRAR
                </a>

            </nav>

        </aside>


        <!-- =================================================
             MENU HAMBÚRGUER
             ================================================= -->

        <div class="topbar-left">

            <label
                for="menu-check"
                class="hamburger"
            >

                <span></span>

                <span></span>

                <span></span>

            </label>

        </div>


        <!-- =================================================
             LOGOTIPO CENTRALIZADO
             ================================================= -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>


        <!-- =================================================
             DIREITA OCULTA
             ================================================= -->

        <div class="topbar-right"></div>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main
        style="
            margin-top: 100px !important;
            padding-top: 0 !important;
            margin-bottom: 20px !important;
        "
    >

        <!-- Seção sem fundo, com o título Acesso do Gestor -->

        <section
            class="boas-vindas"
            style="
                background: transparent !important;
                box-shadow: none !important;
                padding-top: 0 !important;
                margin-top: 0 !important;
                text-align: center;
            "
        >

            <h2
                style="
                    margin: 0 0 15px 0 !important;
                    color: #41af4b !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                "
            >
                Acesso do Gestor
            </h2>


            <!-- =================================================
                 CAIXA DO FORMULÁRIO
                 ================================================= -->

            <div
                class="login-box professor-box"
                style="
                    width: 420px !important;
                    max-width: 100% !important;
                    margin: 0 auto;
                    background: #ffffff;
                    padding: 30px;
                    border-radius: 16px;
                    border: 2px solid #22c55e;
                    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
                    box-sizing: border-box;
                "
            >

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                >


                <h1
                    class="negrito"
                    style="
                        font-size: 1.5rem;
                        margin-bottom: 20px;
                    "
                >
                    Login
                </h1>


                <!-- =================================================
                     FORMULÁRIO
                     ================================================= -->

                <form
                    class="form-grid"
                    style="text-align: left;"
                >


                    <!-- EMAIL -->

                    <div
                        class="form-field col-full"
                        style="margin-bottom: 15px;"
                    >

                        <label for="email_prof">
                            Email
                        </label>


                        <div class="input-group">

                            <input
                                type="email"
                                id="email_prof"
                                name="email"
                                placeholder="Digite seu email"
                                required
                            >

                            <svg viewBox="0 0 24 24">

                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>

                            </svg>

                        </div>

                    </div>


                    <!-- SENHA -->

                    <div
                        class="form-field col-full"
                        style="margin-bottom: 15px;"
                    >

                        <label for="senha_prof">
                            Senha
                        </label>


                        <div class="input-group">

                            <input
                                type="password"
                                id="senha_prof"
                                name="senha"
                                placeholder="Digite sua senha"
                                required
                            >

                            <svg viewBox="0 0 24 24">

                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>

                            </svg>

                        </div>

                    </div>


                    <!-- BOTÃO ENTRAR -->

                    <div
                        class="form-field col-full"
                        style="margin-top: 10px;"
                    >

                        <button
                            type="submit"
                            class="btn-submit"
                            style="width: 100%;"
                        >
                            Entrar
                        </button>

                    </div>

                </form>


                <!-- CADASTRO -->

                <p
                    class="cadastro"
                    style="margin-top: 20px;"
                >

                    Não tem uma conta?

                    <a
                        href="cadastro-professor.html"
                        class="negrito texto-azul"
                    >
                        Cadastre-se aqui
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


</body>
</html>
