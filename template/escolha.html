<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #ffffff !important;
        }


        /* =====================================================
           NAVBAR
           SEM SIDEBAR E SEM HAMBÚRGUER
           ===================================================== */

        .topbar {
            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;

            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;

            margin: 0 !important;
        }


        /* =====================================================
           LOGO CENTRAL
           ===================================================== */

        .topbar-center {

            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;

            justify-content: center !important;
            align-items: center !important;
        }


        .topbar .navbar-logo {

            height: 38px !important;

            width: auto !important;

            display: block !important;
        }


        /* =====================================================
           ÁREA PRINCIPAL
           ===================================================== */

        main {

            margin-top: 90px !important;

            padding-top: 40px !important;

            min-height: calc(100vh - 150px) !important;

            background-color: #ffffff !important;
        }


        /* =====================================================
           ESTILIZAÇÃO CENTRALIZADA DOS ÍCONES DE ESCOLHA
           ===================================================== */

        .escolha-card {

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;

            text-align: center !important;
        }


        .escolha-icone {

            display: block !important;

            width: 80px;

            height: 80px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            margin: 0 auto 15px auto !important;
        }


        .aluno-card .escolha-icone {

            background-image: url('img/aluno.png');
        }


        .professor-card .escolha-icone {

            background-image: url('img/prof.png');
        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
         SOMENTE LOGO
         ===================================================== -->

    <header class="topbar">


        <!-- =================================================
             LOGO CENTRAL
             ================================================= -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>


    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main>

        <!-- Removido o bloco cinza/esbranquiçado aplicando fundo branco puro e retirando sombras -->

        <section
            class="boas-vindas"
            style="
                padding-top: 0 !important;
                margin-top: 0 !important;
                text-align: center;
                background: #ffffff !important;
                box-shadow: none !important;
            "
        >


            <h2
                class="titulo-branco"
                style="
                    margin-top: 0 !important;
                    color: #41af4b !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                "
            >
                Login
            </h2>


            <p
                class="sub-branco"
                style="
                    color: #000000 !important;
                    font-weight: normal !important;
                    margin-top: 8px;
                "
            >
                Bem-vindo de volta! Qual perfil deseja acessar?
            </p>


            <!-- =================================================
                 CARDS DE ESCOLHA
                 ================================================= -->

            <div
                class="escolha-container"
                style="
                    margin-top: 25px !important;
                    display: flex;
                    justify-content: center;
                    gap: 20px;
                    align-items: center;
                "
            >


                <!-- =================================================
                     CARD ALUNO
                     ================================================= -->

                <div
                    class="escolha-card aluno-card"
                    onclick="window.location.href='login.html'"
                >

                    <span class="escolha-icone"></span>


                    <h2>
                        Aluno
                    </h2>


                    <p>
                        Aprender brincando
                    </p>

                </div>


                <!-- =================================================
                     CARD GESTOR
                     ================================================= -->

                <div
                    class="escolha-card professor-card"
                    onclick="window.location.href='login-professor.html'"
                >

                    <span class="escolha-icone"></span>


                    <h2>
                        Gestor
                    </h2>


                    <p>
                        Acompanhar os alunos
                    </p>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


</body>

</html>
