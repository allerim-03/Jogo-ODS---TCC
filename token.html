<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validação de Token - Cultivando o Saber</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">

    <!-- CSS DO PROJETO -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">

    <style>

        /* ==========================================================
           CONFIGURAÇÃO GERAL DA PÁGINA
           ========================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh !important;
            background-color: #3F9B43 !important;
            overflow-x: hidden;
        }

        body {
            background-color: #3F9B43 !important;
        }


        /* ==========================================================
           NAVBAR
           ========================================================== */

        .topbar {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            padding: 10px 25px !important;
            margin: 0 !important;

            background-color: #4CAF50 !important;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.20) !important;

            z-index: 1000 !important;
        }


        /* ==========================================================
           HAMBÚRGUER
           ========================================================== */

        .topbar-left {
            display: flex !important;
            align-items: center !important;
            width: 50px !important;
        }

        .hamburger {
            width: 42px !important;
            height: 42px !important;

            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;

            gap: 5px !important;

            cursor: pointer !important;
            border-radius: 8px !important;
        }

        .hamburger span {
            width: 24px !important;
            height: 3px !important;

            background-color: #FFFFFF !important;

            border-radius: 2px !important;
        }


        /* ==========================================================
           LOGO CENTRAL
           ========================================================== */

        .topbar-center {
            position: absolute !important;

            left: 50% !important;
            transform: translateX(-50%) !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }


        /* ==========================================================
           LADO DIREITO DA NAVBAR
           ========================================================== */

        .topbar-right {
            width: 50px !important;

            visibility: hidden !important;
            pointer-events: none !important;
        }


        /* ==========================================================
           SIDEBAR - PÁGINA NÃO LOGADA
           ========================================================== */

        .menu-checkbox {
            display: none !important;
        }


        /* PAINEL */

        .topbar .sidebar {
            position: fixed !important;

            top: 0 !important;
            left: -300px !important;

            width: 305px !important;
            height: 100vh !important;

            background-color: #1b5e20 !important;

            z-index: 9999 !important;

            transition: left 0.3s ease !important;

            padding: 45px 25px !important;

            display: flex !important;
            flex-direction: column !important;

            box-sizing: border-box !important;
        }


        /* ABRIR SIDEBAR */

        #menu-check:checked ~ .sidebar {
            left: 0 !important;
        }


        /* FUNDO ESCURO */

        .topbar .overlay {
            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            background: rgba(0, 0, 0, 0.4) !important;

            z-index: 9998 !important;

            display: none !important;
        }

        #menu-check:checked ~ .overlay {
            display: block !important;
        }


        /* ==========================================================
           PERFIL DO VISITANTE
           ========================================================== */

        .topbar .perfil-sidebar {
            width: 100% !important;

            display: flex !important;
            flex-direction: column !important;

            align-items: center !important;
            justify-content: center !important;

            text-align: center !important;

            padding: 0 0 20px 0 !important;
            margin: 0 0 25px 0 !important;

            border-bottom: 1px solid rgba(255, 255, 255, 0.20) !important;
        }


        /* IMAGEM DA TUGA */

        .topbar .perfil-sidebar .icone-visitante,
        .topbar .perfil-sidebar .mascote-icon {
            display: block !important;

            width: 100px !important;
            height: 100px !important;

            margin: 0 0 10px 0 !important;

            font-size: 0 !important;
        }


        /* IMAGEM REAL DA TUGA */

        .topbar .perfil-sidebar img {
            width: 100px !important;
            height: 100px !important;

            object-fit: contain !important;

            image-rendering: pixelated !important;

            margin: 0 0 10px 0 !important;
        }


        /* VISITANTE */

        .topbar .perfil-sidebar p {
            color: #FFB72B !important;

            font-family: 'Montserrat', sans-serif !important;

            font-size: 1.3rem !important;
            font-weight: 700 !important;

            margin: 0 !important;

            text-align: center !important;
        }


        /* ==========================================================
           BOTÕES DO SIDEBAR
           ========================================================== */

        .topbar .sidebar-actions {
            width: 100% !important;

            display: flex !important;
            flex-direction: column !important;

            gap: 14px !important;

            margin-top: 0 !important;
        }


        /* BOTÕES */

        .topbar .sidebar-actions a {
            width: 100% !important;

            height: 62px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            border-radius: 14px !important;

            font-family: 'Montserrat', sans-serif !important;

            font-size: 1rem !important;
            font-weight: 700 !important;

            text-decoration: none !important;

            transition: 0.2s ease !important;
        }


        /* ENTRAR */

        .topbar .sidebar-actions a.btn-secundario {
            background: transparent !important;

            color: #FFFFFF !important;

            border: 2px solid #FFFFFF !important;
        }

        .topbar .sidebar-actions a.btn-secundario:hover {
            background: rgba(255, 255, 255, 0.12) !important;
        }


        /* CADASTRAR */

        .topbar .sidebar-actions a:not(.btn-secundario) {
            background: #FFFFFF !important;

            color: #1b5e20 !important;

            border: 2px solid #FFFFFF !important;
        }

        .topbar .sidebar-actions a:not(.btn-secundario):hover {
            background: #f2f2f2 !important;
        }


        /* ==========================================================
           ÁREA PRINCIPAL
           ========================================================== */

        main {
            margin: 0 !important;

            padding: 40px 0 60px 0 !important;

            width: 100% !important;

            min-height: calc(100vh - 90px) !important;

            background-color: #3F9B43 !important;

            display: flex !important;

            justify-content: center !important;

            align-items: flex-start !important;
        }


        /* ==========================================================
           SEÇÃO
           ========================================================== */

        .boas-vindas {
            width: 100% !important;

            background: transparent !important;

            box-shadow: none !important;

            padding: 0 !important;

            margin: 0 !important;

            text-align: center !important;
        }


        /* ==========================================================
           TÍTULO PRINCIPAL
           ========================================================== */

        .titulo-token {
            margin: 0 0 10px 0 !important;

            padding: 0 !important;

            color: #FFFFFF !important;

            font-family: 'Nunito', sans-serif !important;

            font-size: 2.2rem !important;

            font-weight: 800 !important;

            text-align: center !important;
        }


        /* ==========================================================
           SUBTÍTULO
           ========================================================== */

        .subtitulo-token {
            margin: 0 0 25px 0 !important;

            padding: 0 !important;

            color: #FFFFFF !important;

            font-family: 'Poppins', sans-serif !important;

            font-size: 1rem !important;

            font-weight: 400 !important;

            text-align: center !important;
        }


        /* ==========================================================
           CAIXA BRANCA
           SEM CONTORNO AZUL
           ========================================================== */

        .login-box {
            width: calc(100% - 40px) !important;

            max-width: 500px !important;

            margin: 0 auto !important;

            background: #FFFFFF !important;

            padding: 30px !important;

            border-radius: 16px !important;

            border: none !important;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.10) !important;

            text-align: center !important;
        }


        /* ==========================================================
           MASCOTE DA CAIXA
           ========================================================== */

        .login-box img {
            image-rendering: -moz-crisp-edges !important;

            image-rendering: -webkit-optimize-contrast !important;

            image-rendering: pixelated !important;

            image-rendering: crisp-edges !important;

            width: 70px !important;

            height: auto !important;

            margin: 0 auto 10px auto !important;

            display: block !important;
        }


        /* ==========================================================
           TÍTULO TOKEN
           ========================================================== */

        .login-box h1 {
            font-size: 1.5rem !important;

            margin: 0 0 20px 0 !important;

            color: #41af4b !important;

            font-family: 'Nunito', sans-serif !important;

            font-weight: 800 !important;
        }


        /* ==========================================================
           FORMULÁRIO
           ========================================================== */

        .form-grid {
            width: 100% !important;

            text-align: left !important;
        }

        .form-field {
            width: 100% !important;

            margin-bottom: 15px !important;
        }


        /* LABEL */

        .form-field label {
            display: block !important;

            margin-bottom: 7px !important;

            color: #333333 !important;

            font-family: 'Poppins', sans-serif !important;

            font-weight: 600 !important;

            text-align: left !important;
        }


        /* ==========================================================
           CAMPO DO TOKEN
           ========================================================== */

        .input-group {
            position: relative !important;

            width: 100% !important;

            display: block !important;
        }


        .input-group input {
            width: 100% !important;

            height: 48px !important;

            /*
             * ESQUERDA = LOCAL DOS NÚMEROS
             * DIREITA = ESPAÇO RESERVADO PARA O CADEADO
             */
            padding: 0 50px 0 15px !important;

            border: 1px solid #D1D5DB !important;

            border-radius: 8px !important;

            background-color: #FFFFFF !important;

            color: #333333 !important;

            font-family: 'Poppins', sans-serif !important;

            font-size: 1rem !important;

            font-weight: 600 !important;

            letter-spacing: 2px !important;

            text-align: left !important;

            outline: none !important;

            box-shadow: none !important;
        }


        /* CAMPO AO CLICAR */

        .input-group input:focus {
            border-color: #38bdf8 !important;

            box-shadow:
                0 0 0 2px rgba(56, 189, 248, 0.15) !important;
        }


        /* ==========================================================
           PLACEHOLDER
           ========================================================== */

        .input-group input::placeholder {
            color: #999999 !important;

            opacity: 1 !important;

            letter-spacing: 0 !important;

            text-align: left !important;
        }


        .input-group input:focus::placeholder {
            color: transparent !important;
        }


        /* ==========================================================
           CADEADO
           
           IMPORTANTE:
           FICA À DIREITA DO CAMPO.
           NÃO FICA SOBRE OS NÚMEROS.
           ========================================================== */

        .input-group svg {
            position: absolute !important;

            right: 15px !important;

            left: auto !important;

            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 20px !important;

            height: 20px !important;

            fill: #777777 !important;

            pointer-events: none !important;

            z-index: 5 !important;
        }


        /* ==========================================================
           BOTÃO VALIDAR
           ========================================================== */

        .form-field button {
            width: 100% !important;

            margin-top: 10px !important;
        }


        /* ==========================================================
           MENSAGEM DE ERRO
           ========================================================== */

        .erro-token {
            display: none;

            margin-top: 8px !important;

            color: #d32f2f !important;

            font-family: 'Poppins', sans-serif !important;

            font-size: 0.85rem !important;

            font-weight: 600 !important;

            text-align: left !important;
        }

        .erro-token.mostrar {
            display: block !important;
        }


        /* ==========================================================
           REENVIAR
           ========================================================== */

        .cadastro {
            margin-top: 20px !important;

            font-size: 0.9rem !important;

            color: #555555 !important;

            font-family: 'Poppins', sans-serif !important;
        }

        .cadastro a {
            color: #38bdf8 !important;

            font-weight: 700 !important;

            text-decoration: none !important;
        }


        /* ==========================================================
           RODAPÉ
           ========================================================== */

        footer {
            margin: 0 !important;

            padding: 15px 20px !important;

            background-color: #3F9B43 !important;

            color: #FFFFFF !important;

            text-align: center !important;

            font-family: 'Poppins', sans-serif !important;
        }

        footer p {
            margin: 0 !important;

            color: #FFFFFF !important;
        }


        /* ==========================================================
           RESPONSIVIDADE
           ========================================================== */

        @media (max-width: 600px) {

            main {
                padding-top: 30px !important;

                padding-bottom: 40px !important;
            }

            .titulo-token {
                font-size: 1.8rem !important;
            }

            .subtitulo-token {
                font-size: 0.9rem !important;

                padding: 0 20px !important;
            }

            .login-box {
                width: calc(100% - 30px) !important;

                padding: 25px 20px !important;
            }

            .topbar .sidebar {
                width: 285px !important;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================================
         NAVBAR
         ========================================================== -->

    <header class="topbar">


        <!-- CHECKBOX DO MENU -->

        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >


        <!-- OVERLAY -->

        <label
            for="menu-check"
            class="overlay"
        ></label>


        <!-- ======================================================
             SIDEBAR DO VISITANTE
             ====================================================== -->

        <div class="sidebar">


            <!-- PERFIL -->

            <div class="perfil-sidebar">


                <!-- FOTO DA TUGA -->

                <img
                    src="img/TugaPqn.png"
                    alt="Tuga - Visitante"
                >


                <!-- NOME -->

                <p>
                    Visitante
                </p>

            </div>


            <!-- ==================================================
                 BOTÕES
                 ================================================== -->

            <div class="sidebar-actions">


                <!-- ENTRAR -->

                <a
                    href="escolha.html"
                    class="btn-principal btn-secundario"
                >
                    ENTRAR
                </a>


                <!-- CADASTRAR -->

                <a
                    href="escolha-cadastro.html"
                    class="btn-principal"
                >
                    CADASTRAR
                </a>

            </div>

        </div>


        <!-- ======================================================
             HAMBÚRGUER
             ====================================================== -->

        <div class="topbar-left">

            <label
                for="menu-check"
                class="hamburger"
                aria-label="Abrir menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </label>

        </div>


        <!-- ======================================================
             LOGO CENTRAL
             ====================================================== -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>


        <!-- DIREITA -->

        <div class="topbar-right"></div>

    </header>


    <!-- ==========================================================
         CONTEÚDO
         ========================================================== -->

    <main>

        <section class="boas-vindas">


            <!-- ==================================================
                 TÍTULO
                 
                 A COR BRANCA ESTÁ FORÇADA DIRETAMENTE AQUI.
                 ================================================== -->

            <h2
                class="titulo-token"
                style="color: #FFFFFF !important; font-family: 'Nunito', sans-serif !important;"
            >
                Confirmação de Ingresso
            </h2>


            <!-- SUBTÍTULO -->

            <p class="subtitulo-token">
                Use o código enviado para o seu e-mail
            </p>


            <!-- ==================================================
                 CAIXA
                 ================================================== -->

            <div class="login-box">


                <!-- TUGA -->

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                >


                <!-- TÍTULO -->

                <h1>
                    Token
                </h1>


                <!-- =================================================
                     FORMULÁRIO
                     ================================================= -->

                <form
                    class="form-grid"
                    id="form-token"
                    novalidate
                >


                    <!-- CAMPO -->

                    <div class="form-field col-full">


                        <label for="token_codigo">
                            Código da turma
                        </label>


                        <div class="input-group">


                            <!-- CAMPO DOS 4 DÍGITOS -->

                            <input
                                type="text"
                                id="token_codigo"
                                name="token"
                                placeholder="Insira os 4 dígitos"
                                maxlength="4"
                                inputmode="numeric"
                                autocomplete="off"
                                required
                            >


                            <!-- CADEADO -->

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                                />

                            </svg>

                        </div>


                        <!-- MENSAGEM DE ERRO -->

                        <p
                            id="erro-token"
                            class="erro-token"
                        >
                            Somente números
                        </p>

                    </div>


                    <!-- =================================================
                         BOTÃO
                         ================================================= -->

                    <div
                        class="form-field col-full"
                        style="margin-top: 10px;"
                    >

                        <button
                            type="submit"
                            class="btn-submit btn-azul"
                            style="width: 100%;"
                        >
                            Validar
                        </button>

                    </div>

                </form>


                <!-- ==================================================
                     REENVIAR
                     ================================================== -->

                <p class="cadastro">

                    Não recebeu o e-mail?

                    <a href="#">
                        Reenviar
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================================
         RODAPÉ
         ========================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


    <!-- ==========================================================
         JAVASCRIPT
         ========================================================== -->

    <script>

        const campoToken =
            document.getElementById('token_codigo');

        const formularioToken =
            document.getElementById('form-token');

        const mensagemErro =
            document.getElementById('erro-token');


        /* ==========================================================
           PERMITE SOMENTE NÚMEROS
           ========================================================== */

        campoToken.addEventListener('input', function () {

            this.value =
                this.value.replace(/\D/g, '');

            if (this.value.length > 0) {

                mensagemErro.classList.remove('mostrar');

            }

        });


        /* ==========================================================
           VALIDAÇÃO DO FORMULÁRIO
           ========================================================== */

        formularioToken.addEventListener('submit', function (event) {

            event.preventDefault();


            const valor =
                campoToken.value.trim();


            /* CAMPO VAZIO */

            if (valor === '') {

                mensagemErro.classList.add('mostrar');

                campoToken.focus();

                return;
            }


            /* MENOS DE 4 DÍGITOS */

            if (valor.length < 4) {

                mensagemErro.classList.add('mostrar');

                campoToken.focus();

                return;
            }


            /* TOKEN COM 4 DÍGITOS */

            mensagemErro.classList.remove('mostrar');

        });

    </script>


</body>

</html>
