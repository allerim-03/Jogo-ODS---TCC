<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validação de Token - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0 !important;

            padding: 0 !important;

            min-height: 100vh !important;

            background-color: #3F9B43 !important;

        }


        body {

            overflow-x: hidden;

        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .topbar {

            position: relative !important;

            top: 0 !important;

            left: 0 !important;

            width: 100% !important;

            height: 90px !important;

            min-height: 90px !important;

            margin: 0 !important;

            padding: 10px 25px !important;

            display: flex !important;

            align-items: center !important;

            justify-content: space-between !important;

            box-sizing: border-box !important;

            background-color: #4CAF50 !important;

            /* Sombra para separar a navbar do fundo */

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25) !important;

            z-index: 1000 !important;

        }


        /* =====================================================
           LADO ESQUERDO
           ===================================================== */

        .topbar-left {

            display: flex !important;

            align-items: center !important;

            width: 50px !important;

        }


        /* =====================================================
           LOGO CENTRALIZADO
           ===================================================== */

        .topbar-center {

            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;

            justify-content: center !important;

            align-items: center !important;

        }


        .topbar .navbar-logo {

            height: 38px !important;

            width: auto !important;

            display: block !important;

        }


        /* =====================================================
           LADO DIREITO
           ===================================================== */

        .topbar-right {

            width: 50px !important;

        }


        /* =====================================================
           ÁREA PRINCIPAL
           ===================================================== */

        main {

            margin: 0 !important;

            padding: 45px 20px 60px 20px !important;

            width: 100% !important;

            min-height: calc(100vh - 90px) !important;

            background-color: #3F9B43 !important;

        }


        /* =====================================================
           SEÇÃO
           ===================================================== */

        .boas-vindas {

            background: transparent !important;

            box-shadow: none !important;

            padding: 0 !important;

            margin: 0 !important;

            width: 100% !important;

            text-align: center !important;

        }


        /* =====================================================
           TÍTULO
           ===================================================== */

        .boas-vindas h2 {

            margin: 0 0 10px 0 !important;

            color: #FFFFFF !important;

            font-family: 'Nunito', sans-serif !important;

            font-size: 2.2rem !important;

            font-weight: 800 !important;

            text-align: center !important;

        }


        /* =====================================================
           SUBTÍTULO
           ===================================================== */

        .boas-vindas .sub-branco {

            color: #FFFFFF !important;

            font-family: 'Poppins', sans-serif !important;

            font-weight: 400 !important;

            margin-top: 0 !important;

            margin-bottom: 20px !important;

            text-align: center !important;

        }


        /* =====================================================
           CAIXA DO TOKEN
           ===================================================== */

        .login-box {

            max-width: 400px !important;

            width: 100% !important;

            margin: 0 auto !important;

            background: #FFFFFF !important;

            padding: 25px 30px !important;

            border-radius: 16px !important;

            border: 2px solid #22c55e !important;

            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.18) !important;

            text-align: center !important;

        }


        /* =====================================================
           MASCOTE
           ===================================================== */

        .login-box img {

            image-rendering: -moz-crisp-edges !important;

            image-rendering: -webkit-optimize-contrast !important;

            image-rendering: pixelated !important;

            image-rendering: crisp-edges !important;

            width: 70px !important;

            height: auto !important;

            margin: 0 auto 10px auto !important;

            display: block !important;

        }


        /* =====================================================
           TÍTULO TOKEN
           ===================================================== */

        .login-box h1 {

            font-size: 1.5rem !important;

            margin-top: 0 !important;

            margin-bottom: 20px !important;

        }


        /* =====================================================
           FORMULÁRIO
           ===================================================== */

        .login-box .form-grid {

            text-align: left !important;

        }


        /* =====================================================
           LABEL
           ===================================================== */

        .login-box .form-field label {

            display: block !important;

            margin-bottom: 7px !important;

        }


        /* =====================================================
           GRUPO DO INPUT
           ===================================================== */

        .login-box .input-group {

            position: relative !important;

            width: 100% !important;

            display: flex !important;

            align-items: center !important;

        }


        /* =====================================================
           CAMPO DO TOKEN
           ===================================================== */

        .login-box .input-group input[type="text"] {

            width: 100% !important;

            height: 48px !important;

            padding: 0 48px 0 14px !important;

            margin: 0 !important;

            /*
             * Digitação começa pela esquerda
             */

            text-align: left !important;

            letter-spacing: 2px !important;

            font-weight: 600 !important;

            font-family: 'Poppins', sans-serif !important;

            position: relative !important;

            z-index: 1 !important;

        }


        /* =====================================================
           PLACEHOLDER
           ===================================================== */

        .login-box .input-group input[type="text"]::placeholder {

            text-align: left !important;

            letter-spacing: normal !important;

            font-weight: 400 !important;

            color: #777777 !important;

            opacity: 1 !important;

        }


        /*
         * Ao clicar no campo, o placeholder desaparece.
         */

        .login-box .input-group input[type="text"]:focus::placeholder {

            color: transparent !important;

        }


        /* =====================================================
           CADEADO
           ===================================================== */

        .login-box .input-group svg {

            position: absolute !important;

            right: 14px !important;

            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 20px !important;

            height: 20px !important;

            z-index: 5 !important;

            pointer-events: none !important;

            fill: #555555 !important;

        }


        /* =====================================================
           MENSAGEM "SOMENTE NÚMEROS"
           ===================================================== */

        .mensagem-token {

            display: none;

            color: #d32f2f;

            font-family: 'Poppins', sans-serif;

            font-size: 0.85rem;

            font-weight: 600;

            margin-top: 7px;

            text-align: left;

        }


        .mensagem-token.visivel {

            display: block;

        }


        /* =====================================================
           BOTÃO
           ===================================================== */

        .login-box .btn-submit {

            width: 100% !important;

        }


        /* =====================================================
           RODAPÉ
           ===================================================== */

        footer {

            margin: 0 !important;

        }


        /* =====================================================
           RESPONSIVIDADE
           ===================================================== */

        @media (max-width: 600px) {

            .boas-vindas h2 {

                font-size: 1.8rem !important;

            }


            .login-box {

                padding: 25px 20px !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="topbar">


        <input
            type="checkbox"
            id="menu-check"
            class="menu-checkbox"
        >


        <label
            for="menu-check"
            class="overlay"
        ></label>


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="perfil-sidebar">

                <span class="mascote-icon">
                    🐢
                </span>

                <p>
                    Visitante
                </p>

            </div>


            <nav class="links-sidebar">

                <a href="index.html">
                    HOME
                </a>

                <a href="ods.html">
                    ODS
                </a>

                <a href="sobrenos.html">
                    SOBRE NÓS
                </a>

            </nav>

        </aside>


        <!-- HAMBURGER -->

        <div class="topbar-left">

            <label
                for="menu-check"
                class="hamburger"
                aria-label="Abrir menu"
            >

                <span></span>

                <span></span>

                <span></span>

            </label>

        </div>


        <!-- LOGO -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>


        <div class="topbar-right"></div>


    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main>


        <section
            class="boas-vindas"
        >


            <!-- TÍTULO -->

            <h2>
                Confirmação de Ingresso
            </h2>


            <!-- SUBTÍTULO -->

            <p class="sub-branco">

                Use o código enviado para o seu e-mail

            </p>


            <!-- =================================================
                 CAIXA DO FORMULÁRIO
                 ================================================= -->

            <div class="login-box">


                <!-- MASCOTE -->

                <img
                    src="img/TugaPqn.png"
                    alt="Mascote Tuga"
                >


                <!-- TÍTULO -->

                <h1 class="negrito">

                    Token

                </h1>


                <!-- FORMULÁRIO -->

                <form
                    class="form-grid"
                    id="tokenForm"
                >


                    <div
                        class="form-field col-full"
                        style="margin-bottom: 20px;"
                    >


                        <label
                            for="token_codigo"
                        >

                            Código da turma

                        </label>


                        <!-- CAMPO -->

                        <div class="input-group">


                            <input
                                type="text"
                                id="token_codigo"
                                name="token"
                                placeholder="Insira os 6 dígitos"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="off"
                                required
                            >


                            <!-- CADEADO -->

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                                ></path>

                            </svg>


                        </div>


                        <!-- MENSAGEM -->

                        <span
                            id="mensagem-token"
                            class="mensagem-token"
                        >
                            SOMENTE NÚMEROS
                        </span>


                    </div>


                    <!-- BOTÃO -->

                    <div
                        class="form-field col-full"
                        style="margin-top: 10px;"
                    >

                        <button
                            type="submit"
                            class="btn-submit"
                        >

                            Validar

                        </button>

                    </div>


                </form>


                <!-- REENVIAR -->

                <p
                    class="cadastro"
                    style="
                        margin-top: 20px;
                        font-size: 0.9rem;
                    "
                >

                    Não recebeu o e-mail?

                    <a
                        href="#"
                        class="negrito texto-azul"
                    >

                        Reenviar

                    </a>

                </p>


            </div>


        </section>


    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer>

        <p>
            © 2026 FATEC - Informática para Negócios
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        const tokenForm =
            document.getElementById("tokenForm");


        const tokenInput =
            document.getElementById("token_codigo");


        const mensagemToken =
            document.getElementById("mensagem-token");


        /*
         * Permite somente números.
         */

        tokenInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(/\D/g, "");

                mensagemToken.classList.remove(
                    "visivel"
                );

            }
        );


        /*
         * Validação do botão.
         */

        tokenForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                /*
                 * Campo vazio
                 */

                if (
                    tokenInput.value.trim() === ""
                ) {

                    mensagemToken.textContent =
                        "SOMENTE NÚMEROS";

                    mensagemToken.classList.add(
                        "visivel"
                    );

                    tokenInput.focus();

                    return;

                }


                /*
                 * Código incompleto
                 */

                if (
                    tokenInput.value.length !== 6
                ) {

                    mensagemToken.textContent =
                        "SOMENTE NÚMEROS";

                    mensagemToken.classList.add(
                        "visivel"
                    );

                    tokenInput.focus();

                    return;

                }


                /*
                 * Código preenchido.
                 * Aqui poderá entrar a validação
                 * real do token.
                 */

                mensagemToken.classList.remove(
                    "visivel"
                );

            }
        );


    </script>


</body>

</html>
