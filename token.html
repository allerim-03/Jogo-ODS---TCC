<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Token - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #ffffff !important;
        }

        /* Topbar fixada no topo com layout centralizado */
        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 25px !important;
            background-color: #4CAF50 !important;
            z-index: 1000 !important;
            margin: 0 !important;
        }

        .topbar-left {
            display: flex !important;
            align-items: center !important;
            width: 50px !important;
        }

        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        .topbar-right {
            width: 50px !important;
        }

        /* Compensação para o cabeçalho fixo */
        main {
            margin-top: 90px !important;
            padding-top: 40px !important;
            min-height: calc(100vh - 150px) !important;
            background-color: #ffffff !important;
        }

        /* Garante nitidez absoluta em Pixel Art para o mascote */
        .login-box img {
            image-rendering: -moz-crisp-edges !important;
            image-rendering: -webkit-optimize-contrast !important;
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
            width: 70px;
            height: auto;
            margin: 0 auto 10px auto;
            display: block;
        }
    </style>
</head>

<body style="background-color: #ffffff !important;">

    <!-- TOPBAR / NAVBAR -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <aside class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <nav class="links-sidebar">
                <a href="index.html">HOME</a>
                <a href="ods.html">ODS</a>
                <a href="sobrenos.html">SOBRE NÓS</a>
            </nav>
        </aside>

        <!-- 1. Esquerda: Menu Hamburger -->
        <div class="topbar-left">
            <label for="menu-check" class="hamburger" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <!-- 2. Centro: Logotipo Centralizado -->
        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <!-- 3. Direita: Vazia para manter centralização -->
        <div class="topbar-right"></div>
    </header>

    <main style="background-color: #ffffff !important;">

        <!-- Seção centralizada com fundo branco -->
        <section class="boas-vindas" style="background: #ffffff !important; box-shadow: none !important; padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
            
            <h2 style="margin: 0 0 10px 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Confirmação de Token</h2>
            
            <p class="sub-branco" style="color: #000000 !important; font-weight: normal !important; margin-top: 0; margin-bottom: 20px;">Digite o código enviado para o seu e-mail</p>

            <!-- Caixa do formulário com o mesmo tamanho compacto da autenticação -->
            <div class="login-box" style="max-width: 400px !important; width: 100% !important; margin: 0 auto; background: #ffffff; padding: 25px 30px !important; border-radius: 16px; border: 2px solid #22c55e; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);">
                
                <img src="img/TugaPqn.png" alt="Mascote Tuga">
                
                <h1 class="negrito" style="font-size: 1.5rem; margin-bottom: 20px;">Token</h1>

                <form class="form-grid" style="text-align: left;">
                    <div class="form-field col-full" style="margin-bottom: 20px;">
                        <label for="token_codigo">Código do Token</label>
                        <div class="input-group">
                            <input type="text" id="token_codigo" name="token" placeholder="Insira o código de 6 dígitos" maxlength="6" required style="letter-spacing: 2px; text-align: center; font-weight: 600;">
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </div>
                    </div>

                    <div class="form-field col-full" style="margin-top: 10px;">
                        <button type="submit" class="btn-submit" style="width: 100%;">Validar Token</button>
                    </div>
                </form>

                <p class="cadastro" style="margin-top: 20px; font-size: 0.9rem;">
                    Não recebeu? <a href="#" class="negrito texto-azul">Reenviar código </a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

</body>
</html>
