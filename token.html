<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh !important;
        background-color: #3F9B43 !important;
    }

    body {
        overflow-x: hidden;
    }


    /* =====================================================
       NAVBAR
       ===================================================== */

    .topbar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;

        width: 100% !important;
        height: 90px !important;
        min-height: 90px !important;

        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;

        padding: 10px 25px !important;

        background-color: #4CAF50 !important;

        /* SOMBRA ESCURA PARA DIVIDIR DA ÁREA VERDE */
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.20) !important;

        z-index: 1000 !important;
        margin: 0 !important;
    }


    /* =====================================================
       LADO ESQUERDO DA NAVBAR
       ===================================================== */

    .topbar-left {
        display: flex !important;
        align-items: center !important;
        width: 50px !important;
    }


    /* =====================================================
       LOGO CENTRAL
       ===================================================== */

    .topbar-center {
        position: absolute !important;

        left: 50% !important;
        transform: translateX(-50%) !important;

        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
    }


    .topbar .navbar-logo {
        height: 38px !important;
        width: auto !important;
        display: block !important;
    }


    /* =====================================================
       LADO DIREITO
       ===================================================== */

    .topbar-right {
        width: 50px !important;
    }


    /* =====================================================
       ÁREA PRINCIPAL
       ===================================================== */

    main {
        margin-top: 90px !important;

        padding-top: 40px !important;
        padding-bottom: 40px !important;

        min-height: calc(100vh - 90px) !important;

        /* FUNDO VERDE IGUAL AO SOBRE NÓS */
        background-color: #3F9B43 !important;
    }


    /* =====================================================
       SEÇÃO DE CONFIRMAÇÃO
       ===================================================== */

    .boas-vindas {
        background: transparent !important;
        box-shadow: none !important;

        padding-top: 0 !important;
        margin-top: 0 !important;

        text-align: center !important;
    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    .boas-vindas h2 {
        margin: 0 0 10px 0 !important;

        color: #41af4b !important;

        font-family: 'Nunito', sans-serif !important;
        font-size: 2.2rem !important;
        font-weight: 800 !important;
    }


    /* =====================================================
       TEXTO ABAIXO DO TÍTULO
       ===================================================== */

    .boas-vindas .sub-branco {
        color: #FFFFFF !important;

        font-weight: normal !important;

        margin-top: 0 !important;
        margin-bottom: 20px !important;
    }


    /* =====================================================
       CAIXA DO TOKEN
       ===================================================== */

    .login-box {
        background: #FFFFFF !important;

        border-radius: 16px !important;

        border: 2px solid #22c55e !important;

        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06) !important;

        max-width: 400px !important;
        width: 100% !important;

        margin: 0 auto !important;

        padding: 25px 30px !important;
    }


    /* =====================================================
       MASCOTE TUGA
       ===================================================== */

    .login-box img {
        image-rendering: -moz-crisp-edges !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: pixelated !important;
        image-rendering: crisp-edges !important;

        width: 70px !important;
        height: auto !important;

        margin: 0 auto 10px auto !important;

        display: block !important;
    }


    /* =====================================================
       CAMPO DO TOKEN
       ===================================================== */

    #token_codigo {
        letter-spacing: 2px !important;
        text-align: center !important;
        font-weight: 600 !important;
    }


    /* =====================================================
       RODAPÉ
       ===================================================== */

    footer {
        margin: 0 !important;
    }
</style>
