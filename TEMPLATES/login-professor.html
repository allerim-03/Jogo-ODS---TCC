<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Gestor - Cultivando o Saber</title>
    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/banner.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/botoes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/escolha.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/formularios.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jogos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/journey.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ranking.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rodape.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sobre.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/textos.css') }}">

    <style>
        /* Ajuste isolado para centralizar perfeitamente o logotipo e esconder os botões da direita */
        .topbar {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            position: relative !important;
        }

        .topbar-center {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
        }

        .topbar-right {
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>
<!-- TOPBAR / NAVBAR -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="{{ url_for('escolha') }}" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="{{ url_for('escolha_cadastro') }}" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <!-- 1. Esquerda: Menu Hamburger -->
        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <!-- 2. Centro: Logotipo Centralizado com cultsab.png -->
        <div class="topbar-center">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/cultsab.png') }}" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <!-- 3. Direita: Oculta para manter o alinhamento central da logo -->
        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="{{ url_for('escolha') }}" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="{{ url_for('escolha_cadastro') }}" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

    <main style="margin-top: 100px !important; padding-top: 0 !important; min-height: auto !important; height: auto !important;">

        <section class="boas-vindas" style="padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
            <h2 class="titulo-branco" style="margin: 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Área do Gestor</h2>
           
            <div class="login-box professor-box">
                <img src="{{ url_for('static', filename='img/tuga-pqn.png') }}" alt="Mascote Tuga">
                
                <h1 class="negrito">Login</h1>

                <form action="{{ url_for('login_professor') }}" method="POST">
                    <label for="email_prof">Email</label>
                    <input type="email" id="email_prof" name="email" placeholder="Digite seu email" required>

                    <label for="senha_prof">Senha</label>
                    <input type="password" id="senha_prof" name="senha" placeholder="Digite sua senha" required>

                    <button type="submit">Entrar</button>
                </form>

                <p class="cadastro">
                    Não tem uma conta? <a href="{{ url_for('cadastro_professor') }}" class="negrito">Cadastre-se aqui</a>
                </p>

                <div class="dica professor-dica">
                    <strong>Dica:</strong> Preencha todos os campos obrigatórios!
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

</body>
</html>
