<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/banner.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/botoes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/escolha.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/formularios.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jogos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/journey.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ranking.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/sobre.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/textos.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Topbar Padronizada Fixa */
        .topbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 90px !important;
            min-height: 90px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 25px !important;
            background-color: #4CAF50 !important;
            z-index: 1000 !important;
            margin: 0 !important;
        }

        /* Lado Esquerdo */
        .topbar .left {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
        }

        .topbar .info-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: center !important;
            gap: 6px !important;
        }

        .topbar .navbar-logo {
            height: 38px !important;
            width: auto !important;
            display: block !important;
        }

        /* Nível e Barra de Experiência */
        .topbar .level {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            color: #ffffff !important;
            font-size: 12px !important;
            font-weight: bold !important;
            line-height: 1 !important;
        }

        .topbar .level .star {
            color: #FFDD55 !important;
        }

        .topbar .level .bar {
            width: 120px !important;
            height: 10px !important;
            background-color: #2E7D32 !important;
            border-radius: 10px !important;
            overflow: hidden !important;
        }

        .topbar .level .progress {
            height: 100% !important;
            background-color: #FFDD55 !important;
            border-radius: 10px !important;
        }

        .topbar .level .xp {
            font-size: 11px !important;
            color: #ffffff !important;
            opacity: 0.95;
        }

        /* Menu Central */
        .topbar nav.menu {
            margin-left: auto !important;
            margin-right: 25px !important;
            display: flex !important;
            align-items: center !important;
            gap: 20px !important;
        }

        .topbar nav.menu a {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: bold !important;
            font-size: 15px !important;
            transition: color 0.2s ease !important;
            padding-bottom: 3px !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a:hover {
            color: #FFDD55 !important;
            border-bottom: none !important;
        }

        .topbar nav.menu a.active {
            color: #ffffff !important;
            border-bottom: none !important;
        }

        /* Perfil Circular à Direita */
        .topbar .perfil-externo img,
        .topbar img.foto-perfil {
            width: 45px !important;
            height: 45px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            display: block !important;
            border: 2px solid #ffffff;
        }

        /* Compensação do conteúdo principal */
        main.perfil-container {
            margin-top: 110px !important;
            padding-top: 0 !important;
        }
    </style>
</head>

<body>

    <!-- NAVBAR PADRONIZADA -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <aside class="sidebar">
            <div class="perfil-sidebar">
                <img src="{{ url_for('static', filename='img/foto.png') }}" class="foto-perfil" alt="Foto de perfil">
                <p>Nível 2</p>
            </div>

                <a href="{{ url_for('home') }}">HOME</a>

                <a href="/quiz">QUIZ</a>
                <a href="/jogos">JOGOS</a>
                <a href="/ranking">RANKING</a>
                <a href="/perfil">PERFIL</a>
                <a href="/sobrenos">SOBRE NÓS</a>
            </nav>
        </aside>
