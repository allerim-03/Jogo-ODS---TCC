<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar Perfil - Cultivando o Saber</title><link rel="icon" href="/assets/images/icon.png"><link rel="stylesheet" href="/assets/css/design-system.css">
<script src="/assets/js/services/mock-db.js"></script><script src="/assets/js/core/routes.js"></script>
<script defer src="/assets/js/components/layout.js"></script><script defer src="/assets/js/core/app.js"></script></head>
<body data-page="editar-perfil.html"><a class="skip-link" href="#main-content">Ir para o conteúdo</a><div class="platform-shell"><header id="site-header"></header>
<div class="platform-content"><main class="editar-perfil-container" id="main-content" tabindex="-1">


        <div class="editar-card">


            <div class="editar-header">

                <h2>
                    Editar Perfil
                </h2>

                <p>
                    Personalize seu Guardião do Eco e escolha seu mascote de avatar!
                </p>

            </div>


            <form action="perfil.html" method="GET" class="editar-form">


                <div class="form-grupo">

                    <label class="form-label">
                        Escolha seu Avatar de Animais:
                    </label>


                    <div class="avatars-grid">


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="tuga" checked>

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    <img src="/assets/images/TugaPqn.png" alt="Tartaruga Tuga">
                                </span>

                                <span class="avatar-nome">
                                    Tartaruga Tuga
                                </span>

                            </div>

                        </label>


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="peixe">

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    <img src="/assets/images/foto.png" alt="Peixe Glub">
                                </span>

                                <span class="avatar-nome">
                                    Peixe Glub
                                </span>

                            </div>

                        </label>


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="leao">

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    🦁
                                </span>

                                <span class="avatar-nome">
                                    Leão da Savana
                                </span>

                            </div>

                        </label>


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="macaco">

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    🐒
                                </span>

                                <span class="avatar-nome">
                                    Mico-Leão
                                </span>

                            </div>

                        </label>


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="arara">

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    🦜
                                </span>

                                <span class="avatar-nome">
                                    Arara-Azul
                                </span>

                            </div>

                        </label>


                        <label class="avatar-option">

                            <input type="radio" name="avatar" value="capivara">

                            <div class="avatar-card">

                                <span class="avatar-icon">
                                    🦦
                                </span>

                                <span class="avatar-nome">
                                    Capivara Eco
                                </span>

                            </div>

                        </label>

                    </div>

                </div>


                <div class="form-grupo">

                    <label for="nome-usuario" class="form-label">
                        Nome do Guardião:
                    </label>


                    <input type="text" id="nome-usuario" name="nome" class="form-input" value="Guardião do Eco" required maxlength="25">

                </div>


                <div class="form-grupo">

                    <label for="titulo-usuario" class="form-label">
                        Título da Sua Jornada:
                    </label>


                    <select id="titulo-usuario" name="titulo" class="form-input form-select">

                        <option value="Protetor da Natureza" selected>
                            Protetor da Natureza
                        </option>


                        <option value="Guardião da Biodiversidade">
                            Guardião da Biodiversidade
                        </option>


                        <option value="Defensor da Água Potável">
                            Defensor da Água Potável
                        </option>


                        <option value="Herói do Clima">
                            Herói do Clima
                        </option>


                        <option value="Agente da Reciclagem">
                            Agente da Reciclagem
                        </option>

                    </select>

                </div>


                <div class="editar-acoes">


                    <a href="/perfil" class="btn-principal btn-cancelar">
                        Cancelar
                    </a>


                    <button type="submit" class="btn-principal btn-salvar">
                        Salvar Alterações
                    </button>

                </div>


            </form>

        </div>

    </main>


    <footer class="site-footer"><a href="/">Cultivando o Saber</a><span>Aprender. Cuidar. Transformar.</span><small>© 2026 · FATEC São Bernardo do Campo</small></footer></div></div></body></html>
