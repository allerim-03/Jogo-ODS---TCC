<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro do Gestor - Cultivando o Saber</title><link rel="icon" href="/assets/images/icon.png"><link rel="stylesheet" href="/assets/css/design-system.css">
<script src="/assets/js/services/mock-db.js"></script><script src="/assets/js/core/routes.js"></script>
<script defer src="/assets/js/components/layout.js"></script><script defer src="/assets/js/core/app.js"></script></head>
<body data-page="cadastro-professor.html"><a class="skip-link" href="#main-content">Ir para o conteúdo</a><div class="platform-shell"><header id="site-header"></header>
<div class="platform-content"><main id="main-content" tabindex="-1"><a class="back-link" href="/cadastro">← Escolher outro perfil</a>


    <div class="auth-container">


        <div class="auth-sidebar professor-theme">


            <img src="/assets/images/TugaPqn.png" alt="Mascote Tuga" class="mascote">


            <h2>
                Bem-vindo!
            </h2>


            <p>
                Acompanhe o desempenho da sua turma e gerencie seus alunos em um só lugar.
            </p>


            <p>
                Já possui uma conta?
            </p>


            <a href="/entrar/gestor" class="btn-outline">
                ENTRAR
            </a>


        </div>



        <div class="auth-content">


            <h1>
                Cadastro do Gestor
            </h1>


            <form class="form-grid" id="form-cadastro-professor">


                <div class="form-field col-full">


                    <label for="name_user">
                        Nome Completo
                    </label>


                    <div class="input-group">


                        <input type="text" id="name_user" name="name_user" placeholder="Digite seu nome completo" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="id_gender">
                        Gênero
                    </label>


                    <div class="input-group">


                        <select id="id_gender" name="id_gender" required>

                            <option value="" disabled selected>
                                Selecione
                            </option>

                            <option value="1">
                                Feminino
                            </option>

                            <option value="2">
                                Masculino
                            </option>

                            <option value="3">
                                Não-binário
                            </option>

                            <option value="4">
                                Prefiro não informar
                            </option>

                        </select>


                        <svg viewbox="0 0 24 24">

                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="birth_user">
                        Nascimento
                    </label>


                    <div class="input-group">


                        <input type="date" id="birth_user" name="birth_user" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.89 2-2V5c0-1.1-.89-2-2-2zm0 16H5V8h14v11z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field col-full">


                    <label for="registration_user">
                        Disciplina
                    </label>


                    <div class="input-group">


                        <input type="text" id="registration_user" name="registration_user" placeholder="Ex. Ciências e Meio Abiente ">


                        <svg viewbox="0 0 24 24">

                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="main_email">
                        E-mail Organizacional
                    </label>


                    <div class="input-group">


                        <input type="email" id="main_email" name="main_email" placeholder="nome@organizacao.com" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="personal_email">
                        E-mail Secundário
                    </label>


                    <div class="input-group">


                        <input type="email" id="personal_email" name="personal_email" placeholder="nome@gmail.com" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="password_user">
                        Senha
                    </label>


                    <div class="input-group">


                        <input type="password" id="password_user" name="password_user" placeholder="Sua senha" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field">


                    <label for="confirm_password">
                        Confirmar Senha
                    </label>


                    <div class="input-group">


                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>


                        <svg viewbox="0 0 24 24">

                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>

                        </svg>


                    </div>


                </div>



                <div class="form-field col-full">


                    <button type="submit" class="btn-submit">
                        CADASTRAR
                    </button>


                </div>


            </form>


        </div>


    </div>


</main>



<footer class="site-footer"><a href="/">Cultivando o Saber</a><span>Aprender. Cuidar. Transformar.</span><small>© 2026 · FATEC São Bernardo do Campo</small></footer></div></div></body></html>
