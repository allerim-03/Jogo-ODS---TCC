<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body data-page="login-professor.html"><a class="skip-link" href="#main-content">Ir para o conteúdo</a><div class="platform-shell"><header id="site-header"></header>
<div class="platform-content"><main id="main-content" tabindex="-1"><a class="back-link" href="/entrar">← Escolher outro perfil</a>


        <section class="boas-vindas">


            <h2>
                Acesso do Gestor
            </h2>



            <div class="login-box professor-box">


                <img src="/assets/images/TugaPqn.png" alt="Mascote Tuga">



                <h1 class="negrito">
                    Login
                </h1>



                <form class="form-grid">


                    <div class="form-field col-full">


                        <label for="email_prof">
                            Email
                        </label>



                        <div class="input-group">


                            <input type="email" id="email_prof" name="email" placeholder="Digite seu email" required>


                            <svg viewbox="0 0 24 24">

                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>

                            </svg>


                        </div>


                    </div>



                    <div class="form-field col-full">


                        <label for="senha_prof">
                            Senha
                        </label>



                        <div class="input-group">


                            <input type="password" id="senha_prof" name="senha" placeholder="Digite sua senha" required>


                            <svg viewbox="0 0 24 24">

                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>

                            </svg>


                        </div>


                    </div>



                    <div class="form-field col-full">


                <button type="submit" class="btn-submit">Entrar</button>

                    </div>


                </form>



                <p class="cadastro">

                    Não tem uma conta?


                    <a href="/cadastro/gestor" class="negrito texto-azul">
                        Cadastre-se aqui
                    </a>


                </p>


            </div>


        </section>


    </main>



    <footer class="site-footer"><a href="/">Cultivando o Saber</a><span>Aprender. Cuidar. Transformar.</span><small>© 2026 · FATEC São Bernardo do Campo</small></footer></div></div></body></html>
