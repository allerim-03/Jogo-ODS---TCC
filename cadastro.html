<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Aluno - Cultivando o Saber</title>

    <!-- Fontes oficiais do Guia de Estilo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSSs do projeto -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/botoes.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/escolha.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/jogos.css">
    <link rel="stylesheet" href="css/journey.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/rodape.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/sobre.css">
    <link rel="stylesheet" href="css/textos.css">
</head>

<body>

    <!-- TOPBAR / NAVBAR (IDÊNTICO À HOME.HTML) -->
    <header class="topbar">
        <input type="checkbox" id="menu-check" class="menu-checkbox">
        <label for="menu-check" class="overlay"></label>

        <!-- Sidebar Mobile -->
        <div class="sidebar">
            <div class="perfil-sidebar">
                <span class="mascote-icon">🐢</span>
                <p>Visitante</p>
            </div>

            <div class="sidebar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal">CADASTRAR</a>
            </div>
        </div>

        <!-- 1. Esquerda: Menu Hamburger -->
        <div class="topbar-left">
            <label for="menu-check" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>

        <!-- 2. Centro: Logotipo Centralizado com cultsab.png -->
        <div class="topbar-center">
            <div class="logo">
                <img src="img/cultsab.png" alt="Cultivando o Saber" class="navbar-logo">
            </div>
        </div>

        <!-- 3. Direita: Ações de Login/Cadastro -->
        <div class="topbar-right">
            <div class="topbar-actions">
                <a href="escolha.html" class="btn-principal btn-secundario btn-sm">ENTRAR</a>
                <a href="escolha-cadastro.html" class="btn-principal btn-sm">CADASTRAR</a>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main style="margin-top: 100px !important; padding-top: 0 !important; margin-bottom: 20px !important; min-height: auto !important; height: auto !important;">

        <section class="boas-vindas" style="padding-top: 0 !important; margin-top: 0 !important; text-align: center;">
            <h2 class="titulo-branco" style="margin: 0 !important; color: #41af4b !important; font-family: 'Nunito', sans-serif; font-size: 2.2rem; font-weight: 800;">Bem-vindo!</h2>
            <p class="sub-branco" style="color: #000000 !important; font-weight: normal !important; margin-top: 8px;">Venha aprender brincando</p>

            <div class="login-box">
                <img src="img/TugaPqn.png" alt="Mascote Tuga">
            
                <h1 class="texto-azul negrito">Cadastro do Aluno</h1>
            
                <form>
                    <label>Usuário</label>
                    <input type="text" placeholder="Digite o nome" required>

                    <label>Email</label>
                    <input type="email" placeholder="Digite o email" required>

                    <label>Senha</label>
                    <input type="password" placeholder="Escolha a senha" required>

                    <label>Repita a senha</label>
                    <input type="password" placeholder="Confirme sua senha" required>
                    
                    <button type="submit" class="btn-cadastrar">Criar</button>
                </form>

                <p class="cadastro">Já tem uma conta? <a href="login.html" class="texto-azul negrito">Faça login aqui</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 FATEC - Informática para Negócios</p>
    </footer>

</body>
</html>
