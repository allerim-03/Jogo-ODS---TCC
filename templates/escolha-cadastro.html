<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Cultivando o Saber</title>

    <!-- Favicon / Ícone da guia -->
    <link rel="icon" type="image/png" href="img/icon.png">


    <!-- =====================================================
         FONTES
    ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;600&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         CSS DO PROJETO
    ===================================================== -->

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/banner.css">
    <link rel="stylesheet" href="/static/css/botoes.css">
    <link rel="stylesheet" href="/static/css/cards.css">
    <link rel="stylesheet" href="/static/css/escolha.css">
    <link rel="stylesheet" href="/static/css/formularios.css">
    <link rel="stylesheet" href="/static/css/jogos.css">
    <link rel="stylesheet" href="/static/css/journey.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/quiz.css">
    <link rel="stylesheet" href="/static/css/ranking.css">
    <link rel="stylesheet" href="/static/css/rodape.css">
    <link rel="stylesheet" href="/static/css/sidebar.css">
    <link rel="stylesheet" href="/static/css/sobre.css">
    <link rel="stylesheet" href="/static/css/textos.css">


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0 !important;
            padding: 0 !important;

            background-color: #ffffff !important;

            width: 100% !important;
            min-height: 100% !important;

        }


        /* =====================================================
           NAVBAR
           SEM SIDEBAR E SEM HAMBÚRGUER
        ===================================================== */

        .topbar {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;

            height: 90px !important;
            min-height: 90px !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            padding: 10px 25px !important;

            background-color: #4CAF50 !important;

            z-index: 1000 !important;

            margin: 0 !important;

        }


        /* =====================================================
           LOGO CENTRAL
        ===================================================== */

        .topbar-center {

            position: absolute !important;

            left: 50% !important;

            transform: translateX(-50%) !important;

            display: flex !important;

            justify-content: center !important;

            align-items: center !important;

        }


        .topbar .navbar-logo {

            height: 38px !important;

            width: auto !important;

            display: block !important;

        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {

            margin-top: 90px !important;

            padding-top: 40px !important;

            min-height: calc(100vh - 175px) !important;

            background-color: #ffffff !important;

        }


        /* =====================================================
           CARDS
        ===================================================== */

        .escolha-card {

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;

            text-align: center !important;

        }


        .escolha-icone {

            display: block !important;

            width: 80px;

            height: 80px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            margin: 0 auto 15px auto !important;

        }


        .aluno-card .escolha-icone {

            background-image: url('img/aluno.png');

        }


        .professor-card .escolha-icone {

            background-image: url('img/prof.png');

        }


        /* =====================================================
           RODAPÉ
           LARGURA TOTAL DA PÁGINA
        ===================================================== */

        footer {

            width: 100% !important;

            min-width: 100% !important;

            height: 85px !important;

            min-height: 85px !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            background-color: #CCCCCC !important;

            margin: 0 !important;

            padding: 0 !important;

            border: none !important;

            box-shadow: none !important;

            text-align: center !important;

            position: relative !important;

            left: 0 !important;

        }


        footer p {

            margin: 0 !important;

            padding: 0 !important;

            color: #ffffff !important;

            font-family: 'Poppins', sans-serif !important;

            font-size: 18px !important;

            font-weight: 400 !important;

            text-align: center !important;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
         SOMENTE LOGO
    ===================================================== -->

    <header class="topbar">


        <!-- =================================================
             LOGO CENTRAL
        ================================================= -->

        <div class="topbar-center">

            <div class="logo">

                <img
                    src="/static/img/cultsab.png"
                    alt="Cultivando o Saber"
                    class="navbar-logo"
                >

            </div>

        </div>


    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>


        <section
            class="boas-vindas"
            style="
                padding-top: 0 !important;
                margin-top: 0 !important;
                text-align: center;
                background: #ffffff !important;
                box-shadow: none !important;
            "
        >


            <!-- TÍTULO -->

            <h2
                style="
                    margin: 0 !important;
                    color: #41af4b !important;
                    font-family: 'Nunito', sans-serif;
                    font-size: 2.2rem;
                    font-weight: 800;
                "
            >

                Crie sua conta

            </h2>


            <!-- SUBTÍTULO -->

            <p
                class="sub-branco"
                style="
                    color: #000000 !important;
                    font-weight: normal !important;
                    margin-top: 8px;
                "
            >

                Você é:

            </p>


            <!-- =================================================
                 CARDS DE ESCOLHA
            ================================================= -->

            <div
                class="escolha-container"
                style="
                    margin-top: 25px !important;
                    display: flex;
                    justify-content: center;
                    gap: 20px;
                    align-items: center;
                "
            >


                <!-- ALUNO -->

                <div
                    class="escolha-card aluno-card"
                    onclick="window.location.href='cadastro.html'"
                >

                    <span class="escolha-icone"></span>


                    <h2>

                        Aluno

                    </h2>

                </div>


                <!-- GESTOR -->

                <div
                    class="escolha-card professor-card"
                    onclick="window.location.href='cadastro-professor.html'"
                >

                    <span class="escolha-icone"></span>


                    <h2>

                        Gestor

                    </h2>

                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>


        <p>

            © 2026 FATEC - Informática para Negócios

        </p>


    </footer>


</body>

</html>
