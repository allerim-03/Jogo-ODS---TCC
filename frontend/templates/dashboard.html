<!--Página dashboard gênerica trocar pela oficial-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ODS Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
        }

        .info {
            font-size: 18px;
            margin: 10px 0;
        }

        .xp-bar {
            width: 100%;
            height: 25px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            width: 0%;
            background: #4CAF50;
            transition: 0.5s;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Dashboard do Jogador</h1>

    <div class="card">
        <h2 id="user-name">Carregando...</h2>

        <div class="info">
            XP: <span id="user-xp">0</span>
        </div>

        <div class="info">
            Level: <span id="user-level">1</span>
        </div>

        <div class="xp-bar">
            <div class="xp-fill" id="xp-fill"></div>
        </div>
    </div>

    <div class="card">
        <h3>Último Status</h3>

        <p>
            Sistema conectado ao Flask e aguardando integração completa.
        </p>
    </div>

</div>

<script>

async function loadUserProgress() {

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/user/1/progress"
        );

        const user = await response.json();

        document.getElementById(
            "user-name"
        ).textContent = user.name;

        document.getElementById(
            "user-xp"
        ).textContent = user.xp;

        document.getElementById(
            "user-level"
        ).textContent = user.level;

        let xpPercent = Math.min(
            (user.xp / 1000) * 100,
            100
        );

        document.getElementById(
            "xp-fill"
        ).style.width = xpPercent + "%";

    }
    catch(error) {

        console.error(
            "Erro ao carregar progresso:",
            error
        );

    }

}

document.addEventListener(
    "DOMContentLoaded",
    loadUserProgress
);

</script>

</body>
</html>
