<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivando o Saber - Quiz</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/ui.css') }}">

<link rel="stylesheet" 
    href="{{ url_for('static', filename='css/pages/student.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/quiz.css') }}">

<link rel="stylesheet"
 href="{{ url_for('static', filename='css/components/student-navbar.css') }}">

<!--Página onde responde ao quiz

responde:
POST /submit
quiz-result.html
-->

<body>

{% include 'components/student-navbar.html' %}
{% include 'components/sidebar.html' %}


</div>
<main class="quiz-page">

    <section class="quiz-container card">

        <div class="quiz-header">
            <div class="tuga-message tuga-info">

                <img
                    src="{{ url_for('static', filename='imagens/Tuga.png') }}"
                    class="tuga-avatar"
                    alt="Tuga">

                <div class="tuga-content">

                    <div class="tuga-title">
                        Tuga
                    </div>

                    <p id="tuga-message">
                        Leia com atenção e escolha a melhor resposta.
                    </p>

                </div>

                <div
                    id="loading"
                    class="alert alert-info">
                <h2 id="quiz-title"> </h2>
                    Carregando quiz...

                </div>
         
                

            <p id="quiz-theme"></p>
            <div class="quiz-info">

                <span id="quiz-difficulty" class="badge badge-info"></span>

                <span id="quiz-xp" class="badge badge-level"></span>

            </div>
            <div class="progress-bar quiz-bar">

                <div
                    id="quiz-progress"
                    class="progress-bar-fill">
                </div>

            </div>

            <span id="progress-text"></span>

        </div>


        <div id="question-container">

            <h3 id="question-text"></h3>

            <div
                id="options-container"
                class="options-container">

            </div>

        </div>


        <div class="quiz-actions">

            <button
                id="btn-next"
                class="btn btn-primary hidden">

                Próxima

            </button>

        </div>

    </section>

</main>


<script>

const QUIZ_ID = {{ quiz_id|tojson }};

const USER_ID = {{ session.get("user_id")|tojson }};

</script>

<script src="{{ url_for('static', filename='js/quiz/quiz-api.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz/quiz-ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz/quiz.js') }}"></script>

{% include 'components/footer.html' %}

</body>
</html>
